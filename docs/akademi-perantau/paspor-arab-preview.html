pai di Saudi, lapor diri di peduliwni.kemlu.go.id supaya negara tahu posisimu."]}, {"type": "heading", "text": "Rencana cadangan kalau HP disita"}, {"type": "list", "items": ["HAFAL minimal 1 nomor keluarga di luar kepala — jangan cuma simpan di HP.", "Titipkan kontakmu ke 1-2 PMI lain atau tetangga yang kamu percaya.", "Sepakati jadwal kabar rutin dengan keluarga (misalnya tiap minggu). Kalau kamu tiba-tiba hilang kontak, keluarga bisa lapor ke KP2MI atas namamu.", "Foto atau scan paspor, visa, kontrak, dan iqama-mu. Kirim salinannya ke email sendiri atau ke keluarga SEBELUM berangkat."]}, {"type": "callout", "variant": "tip", "text": "Pelajaran: bikin Kartu SOS, hafal satu nomor keluarga, dan titip kontakmu ke orang dipercaya. Kalau HP-mu diambil, kamu tetap punya jalan minta tolong. Kamu tidak sendirian di sana."}], "id": "942d25a6-ea4e-5db7-b2d5-5cf4a856b301"}, {"lesson_num": 18, "title": "Gaji Ditahan, Paspor Disita, atau Disakiti? Lapor Dulu — Jangan Kabur", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Misalnya gaji kamu sudah tiga bulan tidak dibayar. Hatimu panas, kamu mau kabur dari rumah majikan, cari jalan sendiri. Rasanya itu jalan keluar paling cepat."}, {"type": "paragraph", "text": "Tapi tunggu dulu. Kabur diam-diam justru bisa bikin KAMU yang dianggap salah secara hukum. Ada cara yang lebih aman dan tetap melindungimu. Pelajaran ini mengajari kamu kapan harus lapor, kapan harus menyelamatkan diri, dan bagaimana caranya."}, {"type": "callout", "variant": "info", "title": "Glosarium: Huroob", "text": "Huroob = istilah Saudi untuk pekerja yang dilaporkan majikan 'kabur/melarikan diri'. Akibatnya status kamu jadi ilegal dan susah dilindungi. Nggak usah dihafal — yang penting kamu tahu kabur diam-diam itu berisiko, dan ada jalan resmi yang lebih aman."}, {"type": "heading", "text": "Bedakan dua keadaan ini"}, {"type": "paragraph", "text": "Langkahmu beda tergantung seberapa mendesak masalahnya. Ada dua keadaan."}, {"type": "heading", "text": "Keadaan 1 — nyawamu terancam SEKARANG"}, {"type": "paragraph", "text": "Kalau kamu dipukul, dikurung, atau akan dilukai sekarang juga — ini darurat fisik. Jangan menunggu."}, {"type": "stat", "value": "911", "label": "Nomor darurat terpadu di kota besar", "sub": "Riyadh, Jeddah, Makkah, Madinah — untuk ancaman nyawa SEKARANG"}, {"type": "callout", "variant": "warn", "title": "Untuk ancaman nyawa", "text": "Selamatkan diri ke tempat aman dan hubungi 911 dulu. Kekerasan dan ancaman nyawa BUKAN salahmu, dan bukan hal yang harus kamu tahan demi 'menyelesaikan kontrak'."}, {"type": "heading", "text": "Keadaan 2 — masalah kontrak yang belum mengancam nyawa"}, {"type": "paragraph", "text": "Kalau masalahnya gaji ditahan, paspor disita, atau perlakuan tidak adil — tapi nyawamu belum terancam — JANGAN langsung kabur ke jalanan. Lapor dulu lewat jalur resmi."}, {"type": "steps", "items": ["Hubungi KBRI Riyadh atau KJRI Jeddah (sesuai kotamu) DULU. Boleh juga 19911 (hotline ketenagakerjaan Saudi — tapi layanan Bahasa Indonesia belum tentu ada, jadi utamakan KBRI/KJRI), atau agen resmi PG.", "Sampaikan masalahmu dengan jelas — gaji telat berapa bulan, paspor ditahan, dan sebagainya.", "Minta perlindungan resmi dan, kalau memang berhak, minta proses pindah majikan lewat jalur resmi."]}, {"type": "callout", "variant": "info", "title": "Kenapa lapor lebih aman", "text": "Kabur diam-diam bisa bikin kamu dicap huroob dan dianggap salah secara hukum — justru susah dilindungi. Lapor resmi menjaga statusmu tetap legal, jadi negara dan perwakilan RI bisa membelamu."}, {"type": "quote", "text": "Pesannya bukan 'tahan saja apa pun yang terjadi'. Pesannya: lapor dulu lewat jalur resmi — kecuali nyawamu terancam sekarang, baru selamatkan diri lebih dulu."}, {"type": "callout", "variant": "tip", "text": "Pelajaran: untuk ancaman nyawa, 911 dan selamatkan diri. Untuk masalah lain, lapor resmi dulu — jangan kabur diam-diam, supaya kamu tetap dilindungi, bukan jadi yang disalahkan."}], "id": "1cc67ca7-cca1-54c0-9f13-1fd4f3f51cd5"}, {"lesson_num": 19, "title": "Bertahan Bulan Pertama: Panas Gurun yang Menipu & Rindu Kampung yang Berat", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba bayangkan sebentar"}, {"type": "paragraph", "text": "Bulan pertama di Saudi sering jadi yang paling berat. Badanmu menyesuaikan diri dengan panas yang asing. Hatimu menahan rindu kampung. Dua-duanya wajar, dan dua-duanya bisa kamu lewati. Pelajaran ini menyiapkanmu untuk keduanya."}, {"type": "heading", "text": "Bagian 1 — Panas gurun yang menipu"}, {"type": "paragraph", "text": "Panas di Saudi bisa sampai 45-50 derajat dan sangat kering. Karena kering, keringatmu cepat menguap. Kamu bisa merasa 'ah, nggak terlalu keringatan' — padahal tubuhmu sudah kekurangan cairan parah. Itulah kenapa panas gurun menipu."}, {"type": "stat", "value": "45-50°C", "label": "Panas gurun Saudi", "sub": "Kering dan menipu — jangan tunggu haus baru minum"}, {"type": "callout", "variant": "tip", "title": "Aturan air", "text": "Jangan tunggu haus baru minum. Minum sedikit-sedikit terus sepanjang hari. Hindari kegiatan berat di luar antara jam 12 sampai 3 siang — ini jam paling berbahaya. Pakai baju longgar warna terang."}, {"type": "heading", "text": "Tanda BAHAYA heat stroke (serangan panas)"}, {"type": "list", "items": ["Kulit malah BERHENTI berkeringat padahal panas", "Pusing dan mual", "Bingung atau bicara ngawur", "Rasa mau pingsan"]}, {"type": "callout", "variant": "warn", "title": "Ini DARURAT, bukan capek biasa", "text": "Kalau muncul tanda-tanda di atas, itu serangan panas — bisa mengancam nyawa. 30 menit pertama menentukan."}, {"type": "heading", "text": "Pertolongan pertama heat stroke"}, {"type": "steps", "items": ["Pindahkan orangnya ke tempat sejuk dan teduh.", "Kompres air dingin di leher, ketiak, dan selangkangan.", "Kalau masih sadar, beri minum air atau oralit pelan-pelan.", "Cari bantuan medis segera. Kalau parah, hubungi 911."]}, {"type": "heading", "text": "Bagian 2 — Rindu kampung yang berat"}, {"type": "paragraph", "text": "Di minggu-minggu pertama, banyak perantau merasa sedih berat, kesepian, dan ingin pulang. Ada istilahnya: gegar budaya — perasaan kaget dan tertekan karena semuanya serba baru dan asing."}, {"type": "callout", "variant": "info", "title": "Glosarium: gegar budaya", "text": "Gegar budaya = rasa kaget dan tertekan karena hidup di tempat baru yang serba beda. Hampir semua perantau mengalaminya. Nggak usah dihafal — yang penting kamu tahu ini NORMAL."}, {"type": "quote", "text": "Rindu kampung dan gegar budaya itu normal. Dialami hampir semua perantau, paling kuat di bulan pertama, dan biasanya MEREDA. Kamu tidak gila dan tidak lemah."}, {"type": "heading", "text": "Cara sederhana menjaga hati"}, {"type": "list", "items": ["Tidur cukup tiap malam", "Gerakkan badan walau cuma jalan kaki atau peregangan", "Makan teratur", "Video call keluarga secara rutin", "Jangan pendam masalah sendirian — cerita ke orang yang kamu percaya", "Kalau rasa berat berlarut-larut, cerita ke orang dipercaya dan lapor ke tim PG"]}, {"type": "callout", "variant": "tip", "text": "Pelajaran: bulan pertama paling berat — badan menyesuaikan panas, hati menahan rindu. Itu wajar dan biasanya membaik. Banyak minum, jaga badan, jangan pendam sendiri."}], "id": "ea3c990d-ce5a-5a7e-98a1-8b496c18c303"}, {"lesson_num": 20, "title": "Kuis: Sehat, Tahan Banting & Tahu Harus Lapor ke Mana", "lesson_type": "quiz", "estimated_minutes": 5, "pass_threshold": 70, "questions": [{"id": "q1", "prompt": "Kamu punya gigi berlubang yang kadang sakit. Sebentar lagi kamu berangkat ke Saudi. Apa yang paling tepat kamu lakukan?", "multiple": false, "options": [{"key": "a", "label": "Biarkan saja, nanti berobat di Saudi karena ditanggung majikan"}, {"key": "b", "label": "Obati gigi itu SEKARANG, sebelum berangkat, selagi gampang dan murah"}, {"key": "c", "label": "Minum obat pereda nyeri seadanya dan bawa secukupnya ke Saudi"}]}, {"id": "q2", "prompt": "Apa cara paling aman menyimpan nomor-nomor penting (keluarga, KBRI/KJRI, agen PG)?", "multiple": false, "options": [{"key": "a", "label": "Simpan semua di HP saja, biar praktis dan tidak hilang"}, {"key": "b", "label": "Tulis di Kartu SOS cetak yang disembunyikan, DAN hafal minimal 1 nomor keluarga di luar kepala"}, {"key": "c", "label": "Hafal semua nomor di kepala, tidak perlu ditulis di mana-mana"}]}, {"id": "q3", "prompt": "Majikanmu tidak membayar gaji selama 3 bulan, tapi belum pernah menyakitimu. Langkah paling benar adalah...", "multiple": false, "options": [{"key": "a", "label": "Langsung kabur diam-diam dari rumah majikan dan cari kerja sendiri"}, {"key": "b", "label": "Lapor resmi ke KBRI/KJRI dulu (boleh juga 19911 atau agen PG), lalu minta perlindungan & pindah resmi"}, {"key": "c", "label": "Diam saja dan terus bekerja sampai kontrak selesai"}]}, {"id": "q4", "prompt": "Kamu sedang dipukul dan dikurung oleh majikan SAAT INI juga. Apa yang benar?", "multiple": false, "options": [{"key": "a", "label": "Tunggu sampai besok dan lapor ke agen PG lewat pesan"}, {"key": "b", "label": "Tahan dulu karena lapor saat darurat bisa bikin kamu dicap kabur"}, {"key": "c", "label": "Selamatkan diri ke tempat aman dan hubungi 911 — jangan menunggu"}]}, {"id": "q5", "prompt": "Tanda mana yang menunjukkan serangan panas (heat stroke) yang darurat?", "multiple": false, "options": [{"key": "a", "label": "Banyak keringat dan badan terasa segar setelah minum"}, {"key": "b", "label": "Kulit malah BERHENTI berkeringat padahal panas, bingung, dan mau pingsan"}, {"key": "c", "label": "Sedikit haus dan ingin duduk sebentar"}]}, {"id": "q6", "prompt": "Di bulan pertama kamu merasa sedih berat dan ingin pulang. Sikap paling tepat adalah...", "multiple": false, "options": [{"key": "a", "label": "Anggap diri sendiri lemah dan pendam sendirian biar tidak merepotkan"}, {"key": "b", "label": "Sadari ini normal dan biasanya mereda; jaga tidur & makan, cerita ke orang dipercaya, jangan pendam"}, {"key": "c", "label": "Langsung minta pulang karena tidak akan pernah betah"}]}], "answerKeys": [{"qid": "q1", "correct": ["b"], "weight": 1, "explanation": "Begitu di Saudi, kamu tetap harus minta izin majikan dulu untuk berobat dan kadang tidak langsung dibawa. Masalah gigi yang bisa kamu bereskan sekarang, beresin dulu selagi di Indonesia — supaya tidak jadi siksaan di rantau."}, {"qid": "q2", "correct": ["b"], "weight": 1, "explanation": "HP bisa disita. Maka tulis nomor penting di Kartu SOS cetak yang disembunyikan, dan hafal minimal satu nomor keluarga di kepala. Kalau HP-mu diambil, kamu tetap punya jalan minta tolong."}, {"qid": "q3", "correct": ["b"], "weight": 1, "explanation": "Gaji telat sekitar 3 bulan adalah dasar sah untuk minta pindah majikan lewat jalur resmi. Tapi jalannya lapor — utamakan KBRI/KJRI (boleh juga 19911 atau agen PG) — BUKAN kabur diam-diam, supaya statusmu tetap legal dan tidak dicap huroob."}, {"qid": "q4", "correct": ["c"], "weight": 1, "explanation": "Kalau nyawa terancam sekarang, itu darurat fisik. Selamatkan diri ke tempat aman dan hubungi 911 — jangan menunggu. Kekerasan bukan salahmu dan bukan hal yang harus ditahan."}, {"qid": "q5", "correct": ["b"], "weight": 1, "explanation": "Tanda bahaya heat stroke justru kulit berhenti berkeringat padahal panas, ditambah bingung dan mau pingsan. Ini darurat, bukan capek biasa — pindahkan ke tempat sejuk, kompres dingin, dan cari bantuan medis."}, {"qid": "q6", "correct": ["b"], "weight": 1, "explanation": "Gegar budaya dan rindu kampung itu normal, dialami hampir semua perantau, paling kuat di bulan pertama, dan biasanya mereda. Jaga tidur dan makan, cerita ke orang dipercaya, jangan dipendam sendiri."}], "id": "b19ef9cd-37d1-5f26-bb94-4571d9d7e024"}]}, {"module_num": 6, "id": "bc2257ef-1733-56ce-8f8f-f785b9918f24", "title": "Psikotes DayaLima, Peran Penyalur & Sertifikat Paspormu", "summary": "Modul penutup yang menjadi jembatan ke produk Paspor Perantau Global, ditulis ulang agar SELARAS audiens PRT desa (kritikus menilai versi lama bergeser ke register skilled/formal yang bikin cemas). Pertama menjelaskan KENAPA ada psikotes (diamanatkan UU 18/2017 untuk menilai kesiapan mental — perlindungan untukmu, bukan formalitas PG), lalu MENYIAPKAN peserta secara realistis: dikerjakan online di platform DayaLima (dipandu tim PG), beberapa bagian, di bagian kepribadian tidak ada benar/salah → jawab jujur jadi diri sendiri. Persiapan ditulis untuk realita HP pinjaman/sinyal lemah, bukan 'proctoring otomatis, baterai penuh, kelola 2 jam' yang menakutkan. GAP BARU dari kritikus: satu lesson menjelaskan PERAN & KEWAJIBAN P3MI/PG SELAMA penempatan (monitoring, asuransi/jaminan sosial PMI, perwakilan) — penyalur resmi BERTANGGUNG JAWAB, bukan lepas tangan, memperkuat trust ke PG vs calo. Terakhir alur Paspor + CTA jujur. Dijaga ketat: hal yang masih open (boleh mengulang, bahasa tes, biaya include/terpisah) diframe 'tim PG mendampingi & menjelaskan' dengan nada menenangkan (bukan 'belum pasti' yang bikin ragu); sertifikasi = enabler bukan gate; CTA berhenti di 'penempatan resmi gratis bagi PMI, Paspor = bekal terpisah berbayar' TANPA menyinggung 'tidak perlu utang' (itu Finansial).", "sort_order": 5, "lessons": [{"lesson_num": 21, "title": "Psikotes DayaLima: Kenapa Ada & Cara Menghadapinya dengan Tenang", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Kamu dengar kata 'psikotes' lalu langsung deg-degan. Wajar. Banyak orang mengira ini ujian yang bisa bikin kamu gagal berangkat."}, {"type": "paragraph", "text": "Tapi coba pikir dulu. Kamu akan tinggal jauh dari rumah, di negeri yang bahasanya beda, bekerja di rumah orang yang belum kamu kenal. Apa nggak lebih baik kalau ada yang memastikan dulu hatimu cukup kuat untuk itu?"}, {"type": "paragraph", "text": "Itulah psikotes. Bukan jebakan. Justru pelindung."}, {"type": "heading", "text": "Psikotes DayaLima itu apa"}, {"type": "paragraph", "text": "Kesiapan mental itu bagian penting dari persiapan PMI. Psikotes DayaLima adalah asesmen profesional dari DayaLima untuk menilai kesiapan mentalmu dan memperkuat kesiapanmu — bukan jebakan, bukan ujian yang menentukan boleh-tidaknya kamu berangkat."}, {"type": "paragraph", "text": "Tujuannya menilai kestabilan emosi, daya adaptasi, dan ketahananmu menghadapi tekanan kerja. Singkatnya: memastikan kamu siap secara mental sebelum berangkat."}, {"type": "callout", "variant": "info", "title": "Psikotes itu apa, sih?", "text": "Psikotes = tes untuk mengenali sifat, cara berpikir, dan ketahanan mentalmu. Bukan tes pintar-bodoh. Nggak usah dihafal istilahnya — yang penting kamu tahu ini dibuat untuk MELINDUNGI kamu, bukan menjegalmu."}, {"type": "heading", "text": "Kabar baik: di bagian kepribadian, tidak ada jawaban benar atau salah"}, {"type": "paragraph", "text": "Ini yang paling sering bikin orang salah paham. Sebagian besar psikotes adalah soal kepribadian — menanyakan kamu orang yang seperti apa."}, {"type": "paragraph", "text": "Di bagian itu tidak ada jawaban yang 'bagus' atau 'jelek'. Yang dinilai bukan benar-salahnya, tapi apakah kamu menjawab apa adanya."}, {"type": "quote", "text": "Satu-satunya jawaban salah adalah jawaban yang bukan diri kamu."}, {"type": "paragraph", "text": "Jadi tidak perlu mengarang jawaban biar kelihatan hebat. Cukup jujur, jadi diri sendiri. Itu sudah benar."}, {"type": "heading", "text": "Cara menghadapinya — santai saja, kamu tidak sendirian"}, {"type": "paragraph", "text": "Psikotes DayaLima dikerjakan secara online dan terdiri dari beberapa bagian. DayaLima yang menyiapkan tesnya."}, {"type": "paragraph", "text": "Yang perlu kamu ingat: tim Perantau Global akan memandu cara masuk dan menemanimu. Kalau ada yang bingung, tinggal tanya pendamping PG. Kamu tidak dilepas sendirian."}, {"type": "steps", "items": ["Pilih waktu dan tempat yang paling tenang yang kamu bisa — supaya bisa fokus tanpa terganggu.", "Pastikan ada sinyal yang cukup. Kalau HP-mu pinjaman atau sinyal di rumah lemah, bilang ke tim PG — mereka bantu atur supaya kamu tetap bisa mengerjakan.", "Kerjakan pelan-pelan, satu bagian demi satu bagian. Boleh istirahat sebentar kalau mulai lelah.", "Untuk soal hitungan atau logika: baca soalnya pelan-pelan dulu, tidak perlu buru-buru.", "Untuk soal kepribadian: jawab apa adanya sesuai dirimu, jangan kelamaan menimbang."]}, {"type": "callout", "variant": "tip", "text": "Bingung soal cara masuk platform atau hal teknis lain? Itu bukan urusan yang harus kamu pusingkan sendiri. Tim PG yang akan menjelaskan dan mendampingi. Jadi tidak perlu cemas dari sekarang."}, {"type": "paragraph", "text": "Dan ingat: sertifikat Paspor itu bekal yang MEMPERKUAT kesiapanmu — bukan penghalang berangkat. Psikotes adalah salah satu bagian dari menyiapkan dirimu, bukan ujian yang menentukan boleh-tidaknya kamu pergi."}, {"type": "callout", "variant": "info", "title": "Pelajaran", "text": "Psikotes ada untuk memastikan kamu siap, bukan menjegalmu. Jawab jujur jadi diri sendiri, dan tim PG akan menemani. Itu sudah cukup."}], "id": "66b201bb-efc1-5be8-ac11-e68d05b9cc2a"}, {"lesson_num": 22, "title": "Penyalur Resmi Tidak Lepas Tangan: Apa Tanggung Jawab PG Selama Kamu Bekerja", "lesson_type": "reading", "estimated_minutes": 6, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Setelah kamu naik pesawat dan sampai di Saudi, kira-kira orang yang memberangkatkanmu masih peduli nasibmu atau tidak?"}, {"type": "paragraph", "text": "Di sinilah beda paling besar antara calo dan penyalur resmi."}, {"type": "heading", "text": "Calo hilang. Penyalur resmi tetap bertanggung jawab."}, {"type": "paragraph", "text": "Calo cuma butuh kamu sampai dia dibayar. Begitu kamu berangkat, dia menghilang. Kalau kamu kena masalah di sana, tidak ada yang bisa kamu hubungi."}, {"type": "paragraph", "text": "Penyalur resmi — P3MI berizin seperti Perantau Global — berbeda. Mereka TETAP bertanggung jawab selama kamu bekerja. Ini kewajiban, bukan kebaikan hati."}, {"type": "callout", "variant": "info", "title": "P3MI itu apa?", "text": "P3MI = Perusahaan Penempatan Pekerja Migran Indonesia. Sederhananya: perusahaan resmi berizin yang menyalurkan kamu kerja ke luar negeri secara sah. Perantau Global adalah salah satunya. Nggak usah dihafal singkatannya."}, {"type": "heading", "text": "Apa saja tanggung jawab penyalur resmi selama kamu bekerja"}, {"type": "list", "items": ["MEMANTAU & MENDAMPINGI — penyalur resmi punya kewajiban memantau keadaanmu selama penempatan, dan jadi jalur bantuan kalau ada masalah.", "JAMINAN SOSIAL / ASURANSI PMI — sebagai PMI resmi, kamu didaftarkan ke jaminan sosial (BPJS Ketenagakerjaan) untuk masa penempatan — perlindungan kalau terjadi hal-hal seperti kecelakaan kerja. Cakupan persisnya bisa kamu tanyakan ke tim PG.", "KOORDINASI DENGAN JALUR RESMI — kalau ada kasus, penyalur resmi berkoordinasi dengan KBRI/KJRI dan KP2MI. Jadi pintu pertolonganmu lebih dari satu."]}, {"type": "callout", "variant": "tip", "text": "Simpan kontak PIC atau agen resmi PG di Kartu SOS-mu (yang sudah kamu siapkan di Modul 5). Jangan ragu menghubungi mereka kalau ada apa-apa — memang untuk itulah mereka ada."}, {"type": "heading", "text": "Soal jaminan sosial — tanyakan, jangan sungkan"}, {"type": "paragraph", "text": "Kamu berhak tahu apa saja yang ditanggung dan bagaimana cara klaimnya kalau dibutuhkan. Tanyakan ke tim PG soal cakupan jaminan sosialmu. Itu hakmu untuk bertanya."}, {"type": "callout", "variant": "info", "title": "Kenapa ini bikin jalur resmi lebih aman", "text": "Justru karena penyalur resmi TERIKAT tanggung jawab inilah jalur resmi melindungimu. Tanggung jawab yang melekat itu = perlindunganmu."}, {"type": "callout", "variant": "info", "title": "Pelajaran", "text": "Penyalur resmi t (zero cost). Yang dilarang adalah ditagih untuk yang seharusnya gratis. Paspor PG adalah hal terpisah: bekal yang kamu pilih untuk membuat dirimu lebih siap."}, {"type": "heading", "text": "Satu pesan terakhir yang menyatukan semuanya"}, {"type": "paragraph", "text": "Semua bekal di kursus ini cuma berarti kalau kamu berangkat lewat JALUR RESMI — bukan calo."}, {"type": "list", "items": ["Cek izin penyalurmu di SISKOP2MI (siskop2mi.bp2mi.go.id). Perantau Global / PT Daya Talenta Global bisa kamu cek di sana.", "Pastikan ada kontrak resmi lewat Musaned dan visamu adalah VISA KERJA.", "Ingat: penyalur resmi bertanggung jawab selama kamu bekerja — kamu tidak sendirian."]}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Kamu tinggal selangkah lagi — tuntaskan psikotes, dapat sertifikatmu. Ingat: untuk kerja domestik jalur resmi, biaya penempatan ditanggung majikan dan gratis bagi PMI; Paspor PG adalah bekal terpisah yang kamu pilih untuk menyiapkan diri. Kalau ada yang belum jelas soal jalur berangkatmu, konsultasi gratis dulu dengan tim Perantau Global."}], "id": "c6003c21-895a-52d2-b4c4-3fa6efb42c1a"}, {"lesson_num": 24, "title": "Kuis: Siap Psikotes & Paham Alur Paspor", "lesson_type": "quiz", "estimated_minutes": 4, "pass_threshold": 70, "questions": [{"id": "q1", "prompt": "Di tes kepribadian, kamu bingung: jawab yang 'kelihatan bagus' atau yang sesuai dirimu sendiri? Mana yang paling tepat?", "options": [{"key": "a", "label": "Jawab yang kelihatan paling bagus biar nilainya tinggi"}, {"key": "b", "label": "Jawab jujur sesuai dirimu sendiri — di bagian kepribadian tidak ada benar atau salah"}, {"key": "c", "label": "Minta orang lain yang lebih pintar mengisikannya"}], "multiple": false}, {"id": "q2", "prompt": "HP yang kamu pakai pinjaman dan sinyal di rumah lemah. Apa cara paling tepat menghadapi psikotes DayaLima?", "options": [{"key": "a", "label": "Minta orang lain mengerjakan psikotesnya untukmu"}, {"key": "b", "label": "Bilang ke tim P const flat=[]; COURSE.modules.forEach(m=>m.lessons.forEach(l=>flat.push({m,l})));
const done=JSON.parse(localStorage.getItem('pg-paspor-done')||'{}');
let cur=0;
const $=s=>document.querySelector(s);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function saveDone(){localStorage.setItem('pg-paspor-done',JSON.stringify(done))}
function pct(){const n=Object.keys(done).filter(k=>done[k]).length;return Math.round(n/flat.length*100)}

function buildSidebar(){
 let h=`<div class="brand"><div class="ey">Akademi Perantau · Preview Internal</div><h1>${esc(COURSE.program.title)}</h1><span class="price">Rp 500.000 · 6 modul · 24 pelajaran</span></div>`;
 COURSE.modules.forEach(m=>{
  h+=`<div class="modgrp"><div class="mt">Modul ${m.module_num} · ${esc(m.title)}</div>`;
  m.lessons.forEach(l=>{
   const i=flat.findIndex(f=>f.l.id===l.id);
   const ic=l.lesson_type==='quiz'?'q':'r';const lab=l.lesson_type==='quiz'?'K':'B';
   h+=`<div class="navles" data-i="${i}"><span class="ic ${ic}">${lab}</span><span>${esc(l.title)}</span>${done[l.id]?'<span class="dn">✓</span>':''}</div>`;
  });
  h+=`</div>`;
 });
 $('#side').innerHTML=h;
 $('#side').querySelectorAll('.navles').forEach(n=>n.onclick=()=>{go(+n.dataset.i);$('#side').classList.remove('open')});
}
function renderBlock(b){
 switch(b.type){
  case 'heading':return `<div class="b-h">${esc(b.text)}</div>`;
  case 'paragraph':return `<p class="b-p">${esc(b.text)}</p>`;
  case 'list':return `<ul class="b-list">${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
  case 'steps':return `<ol class="b-steps">${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`;
  case 'stat':return `<div class="b-stat"><div class="v">${esc(b.value)}</div><div class="l">${esc(b.label||'')}</div>${b.sub?`<div class="s">${esc(b.sub)}</div>`:''}</div>`;
  case 'quote':return `<blockquote class="b-quote">${esc(b.text)}</blockquote>`;
  case 'callout':{const v=b.variant||'info';const em=v==='warn'?'⚠️':v==='tip'?'💡':'ℹ️';
    return `<div class="b-call ${v}"><span class="em">${em}</span><div>${b.title?`<b>${esc(b.title)}</b>`:''}${esc(b.text)}</div></div>`;}
  default:return '';
 }
}
function renderQuiz(l){
 const keys={};(l.answerKeys||[]).forEach(k=>keys[k.qid]=k);
 let h=`<div class="qwrap">`;
 l.questions.forEach((q,qi)=>{
  h+=`<div class="q" data-qid="${q.id}"><div class="qp">${qi+1}. ${esc(q.prompt)}</div>`;
  q.options.forEach(o=>{h+=`<div class="opt" data-k="${o.key}"><span class="k">${o.key.toUpperCase()}</span><span>${esc(o.label)}</span></div>`;});
  h+=`<div class="exp"></div></div>`;
 });
 h+=`<div class="qresult"></div></div>`;
 return h;
}
function go(i){
 cur=Math.max(0,Math.min(flat.length-1,i));
 const {m,l}=flat[cur];
 const isQuiz=l.lesson_type==='quiz';
 let body=`<div class="crumb">Modul ${m.module_num} · ${esc(m.title)}</div><h2 class="les">${esc(l.title)}</h2>`;
 body+=`<div class="meta">${isQuiz?'Kuis':'Bacaan'} · ${l.estimated_minutes} menit${isQuiz?` · lulus ≥ ${l.pass_threshold||70}%`:''}</div>`;
 body+= isQuiz ? renderQuiz(l) : (l.blocks||[]).map(renderBlock).join('');
 // buttons
 body+=`<div class="btnrow"><button class="btn g" id="prev" ${cur===0?'disabled':''}>← Sebelumnya</button><div class="spacer"></div>`;
 if(isQuiz){body+=`<button class="btn p" id="check">Periksa Jawaban</button>`;}
 else{body+=`<button class="btn p" id="next2">${done[l.id]?'Lanjut →':'Tandai selesai & lanjut →'}</button>`;}
 body+=`</div>`;
 $('#lesson').innerHTML=body;
 window.scrollTo(0,0);
 // wire
 const prev=$('#prev'); if(prev)prev.onclick=()=>go(cur-1);
 if(isQuiz){
  $('#lesson').querySelectorAll('.q').forEach(qd=>{
   qd.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
     if(qd.dataset.graded)return;
     qd.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');
   });
  });
  $('#check').onclick=()=>gradeQuiz(l);
 }else{
  $('#next2').onclick=()=>{done[l.id]=true;saveDone();buildSidebar();renderProg();if(cur<flat.length-1)go(cur+1);else go(cur);};
 }
 buildSidebar();renderProg();
}
function gradeQuiz(l){
 const keys={};(l.answerKeys||[]).forEach(k=>keys[k.qid]=k);
 let correct=0;const tot=l.questions.length;
 $('#lesson').querySelectorAll('.q').forEach(qd=>{
  qd.dataset.graded='1';
  const qid=qd.dataset.qid;const key=keys[qid]||{correct:[]};
  const sel=qd.querySelector('.opt.sel');const selK=sel?sel.dataset.k:null;
  const ok=selK && key.correct.includes(selK);
  if(ok)correct++;
  qd.querySelectorAll('.opt').forEach(o=>{
   o.classList.remove('sel');
   if(key.correct.includes(o.dataset.k))o.classList.add('correct');
   else if(o.dataset.k===selK)o.classList.add('wrong');
  });
  const ex=qd.querySelector('.exp');ex.innerHTML=`<b>${ok?'Benar.':'Jawaban tepat: '+key.correct.join(', ').toUpperCase()}.</b> ${esc(key.explanation||'')}`;ex.classList.add('show');
 });
 const score=Math.round(correct/tot*100);const th=l.pass_threshold||70;const pass=score>=th;
 const r=$('#lesson .qresult');r.className='qresult show '+(pass?'pass':'fail');
 r.innerHTML=`${pass?'✅ Lulus!':'🔁 Belum lulus.'} Skor kamu ${score}% (${correct}/${tot} benar) · batas lulus ${th}%. ${pass?'':'Coba baca lagi materinya, lalu ulangi.'}`;
 const cb=$('#check');cb.textContent=pass?'Lanjut →':'Ulangi Kuis';
 cb.onclick=()=>{if(pass){done[l.id]=true;saveDone();buildSidebar();renderProg();if(cur<flat.length-1)go(cur+1);}else{go(cur);}};
 if(pass){done[l.id]=true;saveDone();}
 renderProg();
}
function renderProg(){const p=pct();$('#fill').style.width=p+'%';$('#plab').textContent=`Progres: ${p}% selesai · ${Object.keys(done).filter(k=>done[k]).length}/${flat.length} pelajaran`;}
buildSidebar();go(0);
$('#menubtn').onclick=()=>$('#side').classList.toggle('open');
</script>
