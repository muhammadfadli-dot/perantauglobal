<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#BD1622;--red7:#9B1220;--red50:#FCF0F1;--amber:#F59E0B;--amber50:#FFFBEB;--amber7:#B45309;
--blue:#3B82F6;--blue50:#EFF6FF;--blue7:#1D4ED8;--green:#22C55E;--green50:#F0FDF4;--green7:#15803D;
--ink:#1C1917;--ink8:#292524;--n7:#44403C;--n6:#57534E;--n5:#78716C;--n4:#A8A29E;--n2:#E7E5E4;--n1:#F5F5F4;--n05:#FAFAF9}
html{font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',system-ui,sans-serif;color:var(--ink8);background:var(--n05)}
body{display:flex;min-height:100vh}
a{color:var(--red);text-decoration:none}
/* sidebar */
#side{width:300px;flex:0 0 300px;background:#fff;border-right:1px solid var(--n2);height:100vh;position:sticky;top:0;overflow-y:auto}
#side .brand{padding:18px 18px 12px;border-bottom:1px solid var(--n2)}
#side .brand .ey{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
#side .brand h1{font-size:16px;font-weight:800;color:var(--ink);line-height:1.2;margin-top:4px}
#side .brand .price{display:inline-block;margin-top:8px;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
.modgrp{padding:6px 0}
.modgrp .mt{padding:10px 18px 4px;font-size:11px;font-weight:800;color:var(--n5);text-transform:uppercase;letter-spacing:.04em}
.navles{display:flex;gap:8px;align-items:center;padding:8px 18px;font-size:13px;color:var(--n7);cursor:pointer;border-left:3px solid transparent}
.navles:hover{background:var(--n05)}
.navles.active{background:var(--red50);border-left-color:var(--red);color:var(--ink);font-weight:600}
.navles .ic{width:18px;height:18px;flex:0 0 18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.navles .ic.r{background:var(--blue50);color:var(--blue7)}
.navles .ic.q{background:var(--red50);color:var(--red7)}
.navles .dn{margin-left:auto;color:var(--green);font-weight:800}
/* main */
#main{flex:1;max-width:760px;margin:0 auto;padding:32px 40px 96px}
#prog{position:sticky;top:0;background:var(--n05);padding:8px 0 14px;z-index:5}
#prog .bar{height:8px;background:var(--n2);border-radius:999px;overflow:hidden}
#prog .fill{height:100%;background:var(--red);width:0;transition:width .3s}
#prog .lab{font-size:12px;color:var(--n5);margin-top:6px}
.crumb{font-size:12px;color:var(--n5);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
h2.les{font-size:26px;font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.01em;margin-bottom:6px}

/* reading blocks */
.b-h{font-size:18px;font-weight:700;color:var(--ink);margin:22px 0 8px;padding-left:12px;border-left:4px solid var(--amber)}
.b-p{font-size:16px;line-height:1.7;color:var(--n7);margin:10px 0}
.b-list{list-style:none;margin:12px 0}
.b-list li{position:relative;padding-left:28px;margin:8px 0;font-size:15.5px;line-height:1.6;color:var(--n7)}
.b-list li:before{content:"✓";position:absolute;left:0;top:0;color:var(--green7);font-weight:800}
.b-steps{list-style:none;counter-reset:s;margin:12px 0}
.b-steps li{position:relative;padding-left:38px;margin:10px 0;font-size:15.5px;line-height:1.6;color:var(--n7);counter-increment:s}
.b-steps li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;background:var(--red);color:#fff;border-radius:999px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.b-stat{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border:1px solid #FDE68A;border-radius:14px;padding:18px 20px;margin:16px 0;text-align:center}
.b-stat .v{font-size:30px;font-weight:800;color:var(--amber7)}
.b-stat .l{font-size:15px;font-weight:600;color:var(--ink8);margin-top:2px}
.b-stat .s{font-size:13px;color:var(--n5);margin-top:4px}
.b-quote{border-left:4px solid var(--red);background:var(--red50);padding:14px 18px;border-radius:0 12px 12px 0;font-style:italic;font-size:16px;color:var(--n7);margin:16px 0}
.b-call{border-radius:12px;padding:14px 16px;margin:16px 0;font-size:15px;line-height:1.6;display:flex;gap:10px}
.b-call .em{flex:0 0 auto;font-size:18px}
.b-call.tip{background:var(--amber50);border:1px solid #FDE68A;color:var(--n7)}
.b-call.info{background:var(--blue50);border:1px solid #BFDBFE;color:var(--n7)}
.b-call.warn{background:var(--red50);border:1px solid #F8DCDE;color:var(--n7)}
.b-call b{display:block;color:var(--ink);margin-bottom:2px}
/* quiz */
.qwrap{margin:14px 0 4px}
.q{background:#fff;border:1px solid var(--n2);border-radius:14px;padding:18px;margin:14px 0}
.q .qp{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px;line-height:1.5}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--n2);border-radius:10px;margin:7px 0;cursor:pointer;font-size:15px;color:var(--n7);transition:.12s}
.opt:hover{border-color:var(--n4)}
.opt.sel{border-color:var(--red);background:var(--red50)}
.opt.correct{border-color:var(--green);background:var(--green50)}
.opt.wrong{border-color:var(--red);background:var(--red50)}
.opt .k{font-weight:800;color:var(--n5);flex:0 0 auto}
.opt.correct .k{color:var(--green7)}.opt.wrong .k{color:var(--red7)}
.exp{margin-top:10px;font-size:14px;line-height:1.6;color:var(--n6);background:var(--n1);border-radius:10px;padding:10px 14px;display:none}
.exp.show{display:block}
.exp b{color:var(--ink)}
.qresult{border-radius:12px;padding:16px;margin:14px 0;font-weight:600;display:none}
.qresult.show{display:block}
.qresult.pass{background:var(--green50);color:var(--green7);border:1px solid #BBF7D0}
.qresult.fail{background:var(--amber50);color:var(--amber7);border:1px solid #FDE68A}
/* buttons */
.btnrow{display:flex;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--n2)}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:11px 20px;border-radius:10px;border:none;cursor:pointer}
.btn.p{background:var(--red);color:#fff}.btn.p:hover{background:var(--red7)}
.btn.g{background:#fff;border:1.5px solid var(--n2);color:var(--n7)}.btn.g:hover{border-color:var(--n4)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
#menubtn{display:none}
@media(max-width:860px){
 #side{position:fixed;left:-300px;z-index:30;transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
 #side.open{left:0}
 #main{padding:18px 18px 90px}
 #menubtn{display:flex;position:fixed;top:12px;right:12px;z-index:40;background:var(--red);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
 h2.les{font-size:22px}
}

<script>const COURSE={"program": {"slug": "paspor-arab-saudi", "title": "Paspor Perantau Global – Arab Saudi", "subtitle": "Kursus Siap Kerja Arab Saudi + Psikotes DayaLima — bekal biar berangkat benar, tahu hakmu, dan siap kerja", "category": "paspor", "delivery_mode": "in_app", "facilitated_by": "Daya Skill", "country": "saudi_arabia", "is_free": false, "price": 500000, "output_type": "certificate", "credential_issuer": "Perantau Global", "credential_delivery": "in_app", "pass_threshold": 70, "duration_label": "Sekitar 2–2,5 jam, bisa dicicil per pelajaran", "status": "draft", "sort_order": 1, "content": {"intro": "Kelas berbayar untuk kamu yang mau kerja ke Arab Saudi sebagai pekerja rumah tangga atau perawat — terutama yang baru pertama berangkat dan takut kena calo. Di sini kamu disiapkan biar berangkat lewat jalur yang benar, tahu hakmu, paham aturan hidup di rumah majikan, bisa minta tolong saat darurat, dan tahu harus lapor ke mana kalau ada masalah. Ini bekal mandiri seharga Rp500.000 — dirancang supaya kamu berangkat lebih aman dan bisa bertahan di sana, bukan sekadar formalitas.", "benefits": ["Bisa cek sendiri penyalur asli atau calo lewat SISKOP2MI dalam beberapa menit dari HP — termasuk cek Perantau Global / PT Daya Talenta Global", "Hafal tanda calo dan tanda perdagangan orang (TPPO): paspor diminta sejak di kampung, dijanjikan kerja A jadi kerja B, dilarang kontak keluarga — biar kamu bisa mundur sebelum terlambat", "Tahu hakmu yang dilindungi aturan resmi Saudi: maksimal 10 jam kerja sehari, istirahat berlanjut minimal 8 jam, 1 hari libur penuh tiap minggu, dan paspormu tetap di tanganmu (majikan dilarang menahannya)", "Tahu cara membaca isi kontrak/PK sebelum tanda tangan: nominal gaji tertulis, jenis & lokasi kerja jelas, jam kerja, hari libur, dan siapa menanggung tiket pulang", "Paham do/don't budaya & agama Saudi dan lima garis merah berisiko pidana berat — biar kamu aman, dihormati, dan tidak gampang dituduh", "Hafal frasa Arab inti untuk paham perintah rumah dan minta izin, plus Kartu Frasa Darurat yang bisa kamu cetak & bawa (enam kata penyelamat + nomor darurat 911)", "Punya Kartu SOS cetak berisi nomor penting — hotline Saudi 19911, darurat 911, KBRI Riyadh, KJRI Jeddah, KP2MI, dan lapor diri peduliwni.kemlu.go.id — plus rencana cadangan kalau HP-mu disita", "Tahu persiapan kesehatan sebelum berangkat (vaksin, obat rutin + surat dokter, beresin gigi & mata) dan langkah benar saat gaji ditahan atau disakiti: lapor resmi dulu, jangan kabur diam-diam"], "learning_outcomes": ["Membedakan jalur resmi dari jebakan calo: bisa cek penyalur di SISKOP2MI, beda visa kerja vs visa umroh/turis, dan mengenali tanda perdagangan orang (TPPO)", "Membaca kontrak kerja sendiri dan tahu hakmu yang dikunci aturan resmi Saudi — maksimal 10 jam kerja/hari, istirahat berlanjut minimal 8 jam, libur 1 hari penuh seminggu, masa percobaan maksimal 90 hari, dan paspor tetap milikmu", "Hidup di rumah majikan sesuai norma budaya & agama Saudi dan menghindari lima garis merah berisiko pidana berat", "Memakai frasa Arab inti untuk paham perintah dan minta izin, serta hafal mati kata-kata darurat dan nomor 911 untuk minta tolong", "Menyiapkan badan sebelum berangkat (vaksin, obat rutin, gigi & mata), mengenali bahaya heat stroke, dan menjaga diri saat rindu kampung di bulan-bulan pertama", "Tahu langkah lapor yang benar saat gaji ditahan, paspor disita, atau ada kekerasan — lewat KBRI/KJRI, hotline 19911, dan tim Perantau Global — tanpa mengambil risiko huroob"], "final_cta": {"heading": "Tinggal Selangkah Lagi Menuju Sertifikat Paspormu", "body": "Setelah menuntaskan kursus ini, kamu tinggal mengerjakan psikotes DayaLima — asesmen profesional dari DayaLima yang menilai kesiapan mentalmu. Tenang, dikerjakan online dan dipandu tim Perantau Global; di bagian kepribadian tidak ada jawaban benar atau salah, cukup jujur jadi diri sendiri. Begitu kursus dan psikotes selesai, kamu mendapat Sertifikat Paspor Perantau Global - Arab Saudi. Anggap psikotes dan sertifikat ini sebagai bekal yang memperkuat kesiapanmu, bukan penghalang untuk berangkat.", "offer": "Selesaikan psikotes DayaLima dan ambil Sertifikat Paspor Perantau Global - Arab Saudi. Ingat: untuk kerja domestik jalur resmi, biaya penempatan ditanggung majikan dan gratis bagi PMI — Paspor Perantau Global adalah bekal mandiri berbayar yang terpisah, yang kamu pilih untuk menyiapkan diri. Kalau ada yang belum jelas soal jalur berangkatmu, konsultasi dulu dengan tim Perantau Global."}}}, "modules": [{"module_num": 1, "id": "adcee82c-d8b4-53f2-9350-37d79eab0b38", "title": "Berangkatnya Dulu yang Benar: Jalur Resmi vs Jebakan Calo", "summary": "Modul pembuka yang menentukan segalanya — dan sengaja di-front-load karena di sinilah letak nilai paling langka & paling menyelamatkan. Mayoritas PMI yang jadi korban di Arab Saudi sudah kalah sejak berangkat lewat calo dengan visa umroh/ziarah/turis. Modul ini memetakan jalur RESMI dengan bahasa polos: beda fatal VISA KERJA vs visa non-kerja, cara cek perusahaan penyalur asli di SISKOP2MI dalam 2 menit dari HP, prinsip zero cost sebagai SINYAL ANTI-CALO (biaya penempatan ditanggung majikan — kalau diminta bayar puluhan juta, itu tanda calo), dan red flag TPPO/perdagangan orang yang konkret (paspor dipegang sponsor sejak di Indonesia, dijanjikan kerja A ternyata kerja B, ditampung tanpa kejelasan, dipindah-tangankan). Benang merah: keribetan jalur resmi = perlindunganmu. Dijaga ketat — zero-cost di-frame sebagai sudut legalitas/anti-penipuan keberangkatan SAJA; topik dana talangan vs KUR/pembiayaan EKSPLISIT diserahkan ke kursus Finansial dan tidak diajarkan ekonomi utangnya di sini. Catatan dikunci ke dossier: penempatan PRT ke Saudi per data resmi terakhir (Feb 2026) MASIH moratorium/persiapan SPSK — JANGAN klaim 'sudah dibuka'; lembaga sekarang bernama KP2MI; waspadai modus visa 'support worker'.", "sort_order": 0, "lessons": [{"lesson_num": 1, "title": "Kenapa yang 'Cepat dan Gampang' Justru yang Paling Bahaya", "lesson_type": "reading", "estimated_minutes": 6, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Bayangkan ada orang menawari kamu kerja ke Arab Saudi. Katanya bisa berangkat minggu depan. Gajinya besar. Prosesnya gampang, tidak usah pelatihan, tidak usah ribet-ribet. Menurut kamu itu kabar baik atau tanda bahaya?"}, {"type": "paragraph", "text": "Jawabannya mungkin bikin kamu melongo: itu justru tanda bahaya. Janji yang terlalu manis itu pola khas calo. Mari lihat ceritanya lewat dua orang."}, {"type": "heading", "text": "Cerita Wati dan Nuri"}, {"type": "paragraph", "text": "Wati buru-buru. Ada yang menawari berangkat cepat lewat visa umroh, gajinya dijanjikan besar. Wati senang, langsung ikut. Tidak ada pelatihan, tidak ada kontrak yang ditandatangani sendiri, namanya tidak tercatat di negara. Begitu di Saudi, dia kerja pakai visa yang salah. Saat ada masalah, tidak ada yang tahu dia di mana."}, {"type": "paragraph", "text": "Nuri memilih sabar. Dia lewat perusahaan penyalur resmi (P3MI). Memang lebih lama: harus pelatihan, periksa kesehatan, tanda tangan kontrak sendiri, dan datanya dicatat negara. Terasa ribet. Tapi justru karena tercatat resmi, kalau ada apa-apa, negara tahu di mana Nuri dan bisa menolongnya."}, {"type": "quote", "text": "Keribetan jalur resmi itu bukan halangan — itu perlindunganmu."}, {"type": "heading", "text": "Dua kata yang perlu kamu kenal"}, {"type": "callout", "variant": "info", "title": "Arti dua kata ini", "text": "Nonprosedural = berangkat lewat jalan tikus, tidak tercatat negara. Prosedural = jalur resmi yang tercatat, sehingga negara bisa menolong kalau ada masalah. Nggak usah dihafal — intinya: yang tercatat itu yang aman."}, {"type": "paragraph", "text": "Lembaga pemerintah yang melindungi pekerja migran sekarang bernama KP2MI. Dulu namanya BP2MI atau BNP2TKI. Kalau kamu dengar dua nama lama itu, maksudnya lembaga yang sama. Mereka melindungi kamu dan tidak memungut bayaran untuk itu."}, {"type": "list", "items": ["Curigai tawaran 'berangkat cepat, gaji besar, gampang, tanpa pelatihan' — itu pola calo.", "Pilih jalur resmi (P3MI) walaupun terasa lebih lama. Lambat = aman.", "Ingat: KP2MI (dulu BP2MI/BNP2TKI) melindungi kamu secara gratis."]}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Yang menjanjikan jalan pintas hampir selalu menjual jalan masuk ke masalah. Pintu yang benar terasa lebih lambat — dan itu memang seharusnya."}], "id": "b69de91b-57cf-5842-92a2-97272024870b"}, {"lesson_num": 2, "title": "Visa Kerja, Bukan Visa Umroh: Satu Kata yang Menentukan Nasibmu", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Kamu mau kerja di Arab Saudi. Tapi visamu tertulis 'umroh' atau 'turis'. Apakah boleh kamu kerja dengan visa itu? Jawabannya: tidak boleh. Satu kata di visamu bisa menentukan apakah kamu jadi pekerja yang dilindungi, atau orang ilegal yang ketakutan."}, {"type": "heading", "text": "Visa kerja itu beda dari visa umroh atau turis"}, {"type": "paragraph", "text": "Kamu hanya boleh bekerja kalau visamu adalah VISA KERJA. Visa umroh, ziarah, atau turis bukan untuk kerja. Jangan percaya omongan saja. Minta LIHAT SENDIRI tulisan jenis visamu sebelum berangkat."}, {"type": "callout", "variant": "warn", "title": "Modus jebakan paling umum", "text": "Calo memberangkatkan kamu pakai visa umroh atau turis, lalu menyuruh kerja di sana. Begitu visa habis, kamu jadi overstay alias tinggal ilegal. Gajimu bisa ditahan, kamu gampang ditangkap, dan susah ditolong."}, {"type": "paragraph", "text": "Untuk calon PRT atau pengasuh seperti kamu, pintu yang sah adalah lewat perusahaan penyalur berizin (P3MI), seperti Perantau Global. Di luar jalur resmi yang terdaftar, itu namanya nonprosedural — dan kamu tidak terlindungi."}, {"type": "heading", "text": "Jangan buru-buru percaya 'sudah dibuka'"}, {"type": "paragraph", "text": "Kamu mungkin dengar 'penempatan PRT ke Saudi sudah dibuka'. Hati-hati. Per data resmi terakhir (Februari 2026), penempatan PRT ke Saudi masih DALAM PERSIAPAN lewat sistem satu kanal — BUKAN dibuka bebas. Ada juga modus baru: orang dikirim pakai visa 'support worker' supaya kelihatan resmi, padahal itu tetap jalur ilegal."}, {"type": "callout", "variant": "tip", "title": "Yang harus kamu lakukan", "text": "Sebelum percaya kabar 'sudah dibuka', tanyakan dulu status terbaru ke Perantau Global atau KP2MI. Jangan ambil keputusan berdasarkan janji calo."}, {"type": "list", "items": ["Minta lihat sendiri jenis visamu — pastikan tertulis VISA KERJA.", "Tolak kalau disuruh kerja pakai visa umroh, ziarah, atau turis.", "Waspadai modus visa 'support worker'.", "Cek status penempatan terbaru ke PG atau KP2MI, jangan percaya janji calo."]}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Satu kata di visamu — KERJA atau bukan — menentukan apakah kamu pekerja yang dilindungi atau orang ilegal yang ditakuti. Selalu minta lihat visanya sendiri."}], "id": "333c5ebb-2e1d-5f4c-9850-ef0de7b36b04"}, {"lesson_num": 3, "title": "Cek Sendiri dalam 2 Menit: Penyalur Ini Asli atau Calo?", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Sebelum kamu percaya siapa pun yang menjanjikan kerja ke Saudi, ada satu cara mudah untuk tahu dia asli atau calo. Kamu bisa cek sendiri dari HP, gratis, dalam beberapa menit. Yuk kita pelajari."}, {"type": "heading", "text": "Cara cek penyalur asli atau palsu"}, {"type": "steps", "items": ["Buka SISKOP2MI di alamat siskop2mi.bp2mi.go.id dari HP-mu.", "Cari nama perusahaan penyalur yang menawarkan kerja ke kamu.", "Kalau namanya ADA di daftar resmi, perusahaan itu terdaftar. Perantau Global / PT Daya Talenta Global bisa kamu cek di sana.", "Kalau namanya TIDAK ADA di daftar, STOP. Jangan lanjut. Itu kemungkinan besar calo."]}, {"type": "paragraph", "text": "Kalau mau, kamu bahkan boleh mendaftar mandiri lewat siskop2mi.bp2mi.go.id/publik/daftar. Artinya kamu tidak harus bergantung pada perantara yang minta bayaran."}, {"type": "heading", "text": "Diminta bayar puluhan juta? Itu lampu merah"}, {"type": "paragraph", "text": "Ini bagian penting. Untuk biaya PENEMPATAN — tiket, visa, medical, paspor, jasa agen — kamu TIDAK BOLEH dimintai bayar. Itu kewajiban majikan, bukan kamu. Jadi kalau ada yang minta puluhan juta sebagai 'biaya berangkat', curigai itu calo."}, {"type": "callout", "variant": "info", "title": "Yang gratis vs yang berbayar", "text": "Penempatan resmi = GRATIS bagi PMI (ditanggung majikan). Bekal pelatihan atau sertifikasi mandiri seperti Paspor Perantau Global = pilihan berbayar yang terpisah — itu bukan biaya penempatan ilegal. Dua hal ini beda, jangan tertukar."}, {"type": "paragraph", "text": "Medical GAMCA/Wafid (tes darah, urine, rontgen dada) dan OPP (kelas pembekalan wajib) adalah tahap resmi yang tidak boleh dilompati. Kalau ada yang menyuruh skip biar 'cepat berangkat', itu juga tanda calo."}, {"type": "callout", "variant": "info", "title": "Sedikit istilah", "text": "GAMCA sekarang resmi bernama Wafid — itu standar pemeriksaan kesehatan untuk negara Teluk. Portal resminya wafid.com. OPP = kelas pembekalan wajib sebelum berangkat. Nggak usah dihafal namanya, yang penting: kalau disuruh melompati, curigai."}, {"type": "list", "items": ["Cek nama penyalur di SISKOP2MI sebelum percaya. Tidak ada di daftar = berhenti.", "Jangan mau bayar puluhan juta untuk biaya penempatan — itu beban majikan.", "Jangan mau melompati medical atau OPP demi 'cepat berangkat'.", "Minta rincian tertulis dan minta lihat dokumenmu sendiri. Kamu berhak bertanya."]}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Sebelum percaya siapa pun, cek namanya di SISKOP2MI. Diminta bayar puluhan juta untuk yang harusnya gratis? Itu lampu merah calo."}], "id": "c2595d93-536d-58c5-b6a9-9cee99d0fd7c"}, {"lesson_num": 4, "title": "Tanda Bahaya Perdagangan Orang: Saat 'Tawaran Kerja' Sebenarnya Jebakan", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Ada tawaran kerja yang sebenarnya bukan tawaran kerja — tapi jebakan. Namanya perdagangan orang. Kabar baiknya: jebakan ini punya tanda-tanda yang bisa kamu kenali. Kalau kamu tahu tandanya, kamu bisa mundur sebelum terlambat."}, {"type": "callout", "variant": "info", "title": "Apa itu TPPO", "text": "TPPO = Tindak Pidana Perdagangan Orang — saat seseorang 'dijual' atau dieksploitasi dengan tipu daya. Kalau kamu jadi korbannya, kamu BUKAN pelaku — kamu korban, dan negara wajib menolongmu. Nggak usah dihafal singkatannya, yang penting kenali tandanya."}, {"type": "heading", "text": "Empat tanda bahaya yang wajib kamu kenali"}, {"type": "paragraph", "text": "Tanda 1 — Paspor ditahan SEJAK DI INDONESIA. Kalau calo atau sponsor minta memegang paspormu sebelum berangkat 'biar aman', itu tanda bahaya. Paspor adalah milikmu. Tidak ada alasan yang sah untuk menahannya sejak di kampung."}, {"type": "paragraph", "text": "Tanda 2 — Dijanjikan kerja A, ternyata kerja B. Misalnya dijanjikan jadi PRT di kota tertentu, tapi di lapangan disuruh kerja lain di tempat lain. Jenis dan lokasi kerjamu harus jelas dan tertulis. (Cara membaca kontrak akan dibahas lengkap di Modul 2.)"}, {"type": "paragraph", "text": "Tanda 3 — Ditampung tanpa kejelasan. Kamu dikumpulkan di penampungan atau rumah singgah tanpa jadwal pasti, dokumen tidak diperlihatkan, dan kamu dilarang menghubungi keluarga."}, {"type": "paragraph", "text": "Tanda 4 — Dipindah-tangankan. Kamu 'diserahkan' dari satu orang ke orang lain, atau nama dan datamu diganti-ganti. Di bandara atau saat transit: kalau kamu diminta menyembunyikan tujuan aslimu ke petugas, itu jebakan."}, {"type": "callout", "variant": "warn", "title": "Larangan jelas pada majikan di Saudi", "text": "Menahan paspor pekerja itu ILEGAL. Majikan juga dilarang menyewakan jasamu ke orang lain. Jadi kalau ada tanda-tanda di atas, itu bukan hal biasa — itu pelanggaran."}, {"type": "heading", "text": "Apa yang harus kamu lakukan"}, {"type": "steps", "items": ["Berhenti dulu. Jangan terus melangkah hanya karena sungkan.", "Jangan menyerahkan paspormu kepada siapa pun.", "Hubungi keluarga dan beri tahu posisimu.", "Hubungi Perantau Global atau KP2MI untuk minta tolong.", "Lebih baik batal berangkat daripada masuk perangkap."]}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Kalau ada yang menahan paspormu sejak di kampung, mengganti janji kerja, atau melarangmu kontak keluarga — itu bukan kesibukan biasa, itu tanda perdagangan orang. Kamu berhak menolak dan minta tolong."}], "id": "d51d68b1-fd38-5521-90e5-ace9ab14677a"}, {"lesson_num": 5, "title": "Kuis: Kebal Calo & Awas Perdagangan Orang", "lesson_type": "quiz", "estimated_minutes": 5, "pass_threshold": 70, "questions": [{"id": "q1", "prompt": "Ada yang menawari kamu kerja ke Saudi: berangkat minggu depan pakai visa umroh, gaji besar, tanpa pelatihan. Apa respons paling benar?", "options": [{"key": "a", "label": "Langsung ambil, mumpung cepat dan gajinya besar"}, {"key": "b", "label": "Tolak — ini jalur nonprosedural lewat calo, berbahaya"}, {"key": "c", "label": "Terima, tapi minta gajinya dinaikkan dulu"}], "multiple": false}, {"id": "q2", "prompt": "Cara paling tepat memastikan sebuah perusahaan penyalur itu asli, bukan calo?", "options": [{"key": "a", "label": "Percaya saja kalau kantornya kelihatan besar dan ramai"}, {"key": "b", "label": "Cek nama perusahaannya di SISKOP2MI (siskop2mi.bp2mi.go.id)"}, {"key": "c", "label": "Tanya ke teman yang katanya sudah pernah lewat situ"}], "multiple": false}, {"id": "q3", "prompt": "Penyalur minta kamu bayar Rp40 juta sebagai 'biaya berangkat' untuk kerja sebagai PRT. Apa yang benar?", "options": [{"key": "a", "label": "Bayar saja, namanya juga mau kerja ke luar negeri"}, {"key": "b", "label": "Curiga calo — biaya penempatan itu ditanggung majikan, bukan kamu"}, {"key": "c", "label": "Minta dicicil supaya tidak terlalu berat"}], "multiple": false}, {"id": "q4", "prompt": "Dari pilihan ini, visa mana yang sah untuk bekerja di Arab Saudi?", "options": [{"key": "a", "label": "Visa umroh"}, {"key": "b", "label": "Visa turis"}, {"key": "c", "label": "Visa kerja"}], "multiple": false}, {"id": "q5", "prompt": "Sponsor minta memegang paspormu sejak kamu masih di Indonesia, katanya 'biar aman'. Sikap paling tepat?", "options": [{"key": "a", "label": "Serahkan saja, supaya tidak hilang"}, {"key": "b", "label": "Tolak — paspor milikmu, ini tanda bahaya perdagangan orang"}, {"key": "c", "label": "Serahkan, asal dikasih tanda terima"}], "multiple": false}, {"id": "q6", "prompt": "Kamu dijanjikan jadi PRT di Riyadh, tapi di lapangan disuruh kerja lain di kota yang berbeda. Apa yang benar?", "options": [{"key": "a", "label": "Ikuti saja, yang penting tetap dapat gaji"}, {"key": "b", "label": "Ini tanda perdagangan orang — hubungi keluarga dan PG/KP2MI"}, {"key": "c", "label": "Diam saja supaya tidak dianggap rewel"}], "multiple": false}], "answerKeys": [{"qid": "q1", "correct": ["b"], "weight": 1, "explanation": "Janji 'cepat, gaji besar, tanpa pelatihan, pakai visa umroh' itu pola khas calo. Ini jalur nonprosedural yang membuatmu jadi pekerja ilegal dan tanpa perlindungan. Yang benar: tolak."}, {"qid": "q2", "correct": ["b"], "weight": 1, "explanation": "Cara paling pasti adalah cek nama perusahaan di SISKOP2MI. Kalau tidak ada di daftar resmi, jangan lanjut. Kantor mewah atau cerita teman bukan bukti."}, {"qid": "q3", "correct": ["b"], "weight": 1, "explanation": "Biaya penempatan (tiket, visa, medical, paspor, jasa agen) ditanggung majikan, bukan kamu. Diminta bayar puluhan juta untuk yang harusnya gratis adalah lampu merah calo."}, {"qid": "q4", "correct": ["c"], "weight": 1, "explanation": "Hanya visa kerja yang sah untuk bekerja. Visa umroh atau turis bukan untuk kerja — kalau dipakai kerja, kamu jadi tinggal ilegal saat visa habis."}, {"qid": "q5", "correct": ["b"], "weight": 1, "explanation": "Paspor adalah milikmu. Tidak ada alasan sah untuk menahannya sejak di Indonesia. Permintaan ini adalah tanda bahaya perdagangan orang — tolak."}, {"qid": "q6", "correct": ["b"], "weight": 1, "explanation": "Dijanjikan kerja A ternyata kerja B adalah tanda perdagangan orang. Berhenti, hubungi keluarga, dan minta tolong ke Perantau Global atau KP2MI."}], "id": "d3604576-f031-5621-b138-229d68009554"}]}, {"module_num": 2, "id": "651a6fac-06b0-5d73-bef3-bd8426410bd3", "title": "Hak Kerjamu & Isi Kontrak: Kamu Punya Aturan, Pastikan Tertulis", "summary": "Begitu sampai di Saudi, banyak PRT diperlakukan seenaknya karena tidak tahu mereka punya hak yang dilindungi hukum — dan karena tidak pernah diajari MEMBACA kontraknya sendiri. Modul ini jadi 'peta hak + checklist kontrak', dikunci ke regulasi resmi terbaru (Regulation for Domestic Workers HRSD, berlaku Okt 2024). Menjelaskan sistem kafala dengan jujur tapi tidak menakutkan, kenapa kontrak HARUS lewat Musaned (sebagai BUKTI hitam-putih yang melindungi — bukan soal mekanisme gaji), hak konkret yang dikunci angka resmi (maks 10 jam kerja/hari, tidak lebih 5 jam tanpa jeda, istirahat berlanjut minimal 8 jam, 1 hari libur penuh/minggu), kewajiban majikan (tempat tinggal, makan, berobat ditanggung — DILARANG menahan paspor/iqama), masa percobaan maks 90 hari, dan kapan boleh pindah majikan lewat jalur resmi (gaji telat 3 bulan, kekerasan, dll). GAP BARU: satu lesson penuh mengajarkan cara MEMBACA isi kontrak/PK — poin wajib dicek sebelum tanda tangan (nominal gaji tertulis, jenis & lokasi pekerjaan, jam kerja, hari libur, siapa tanggung tiket pulang, klausa berbahaya). Dijaga ketat: TIDAK menjanjikan 'pindah majikan kapan saja' (PRT tidak ikut reformasi mobilitas 2021), TIDAK memakai angka cuti/tiket/pesangon yang verdict-nya refuted, dan Musaned disebut HANYA sebagai bukti perlindungan — kartu Mada & mekanisme penarikan gaji TIDAK disebut sama sekali (itu milik kursus Finansial).", "sort_order": 1, "lessons": [{"lesson_num": 6, "title": "Sebelum Tanda Tangan: Cara Membaca Kontrak Kerjamu", "lesson_type": "reading", "estimated_minutes": 8, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Bayangkan dua orang. Wati cuma dikasih janji lewat omongan: 'Tenang, gajimu besar, kerjanya enak, nanti diatur di sana.' Wati percaya, tanda tangan kertas yang dia sendiri nggak paham isinya. Nuri beda. Dia minta lihat kontraknya, dibaca pelan-pelan, ditanya yang nggak jelas, baru tanda tangan sendiri."}, {"type": "paragraph", "text": "Setahun kemudian, gaji Wati dipotong-potong dan dia disuruh kerja di rumah lain. Pas mau protes, Wati nggak punya apa-apa buat dipegang. Cuma omongan. Nuri punya kontrak hitam-putih. Saat ada masalah, kontrak itu yang bicara untuk dia."}, {"type": "paragraph", "text": "Kontrak kerja itu bukan formalitas. Itu janji tertulis yang melindungimu saat kamu jauh dari rumah. Modul ini ngajarin kamu cara membacanya — supaya kamu jadi Nuri, bukan Wati."}, {"type": "callout", "variant": "info", "title": "Kenalan dulu sama 3 kata (nggak usah dihafal)", "text": "Kafala = sistem sponsor. Artinya status tinggalmu di Saudi nempel ke satu majikan, kayak izin tinggalmu 'dititipkan' ke dia. Musaned = website resmi pemerintah Saudi tempat kontrak PRT dibuat dan dicatat negara. Iqama = KTP-nya pekerja asing di Saudi. Semua ini bakal dijelasin lagi pas muncul — santai aja."}, {"type": "heading", "text": "Kontrak resmi lewat Musaned = bukti hitam-putih"}, {"type": "paragraph", "text": "Musaned itu jalur resmi. Kontrak yang dibuat lewat Musaned tercatat negara Saudi, jadi bukti yang kuat kalau hakmu dilanggar. Janji lisan calo atau kertas kontrak yang nggak lewat Musaned jauh lebih sulit kamu tegakkan kalau ada masalah."}, {"type": "paragraph", "text": "Pastikan kamu sudah punya kontrak resmi yang terdaftar di Musaned SEBELUM berangkat. Dan minta salinanmu sendiri — simpan baik-baik, jangan sampai cuma majikan yang pegang."}, {"type": "callout", "variant": "info", "title": "Penting biar nggak salah paham", "text": "Secara hukum Saudi, hakmu sebenarnya nggak otomatis hilang cuma gara-gara kontrak nggak tertulis. TAPI dengan kontrak resmi Musaned, hakmu JAUH lebih mudah ditegakkan — ada bukti yang tercatat negara. Jadi tetap wajib dipastikan ada. Jangan mau berangkat cuma modal janji mulut."}, {"type": "heading", "text": "6 hal yang WAJIB kamu cek di kontrak"}, {"type": "paragraph", "text": "Sebelum tanda tangan, baca kontrakmu dan pastikan enam hal ini jelas tertulis. Kalau ada yang kosong atau cuma 'nanti dibahas', itu tanda bahaya."}, {"type": "list", "items": ["NOMINAL GAJI tertulis jelas pakai angka — bukan 'nanti diatur di sana'. Berapa per bulan harus hitam di atas putih.", "JENIS PEKERJAAN jelas — kamu PRT, pengasuh, atau apa. Pastikan sesuai yang dijanjikan ke kamu.", "LOKASI KERJA jelas — kamu kerja di rumah siapa, di kota mana. Beda dari yang dijanjikan = tanda bahaya.", "JAM KERJA & HARI LIBUR sesuai aturan (dibahas di pelajaran berikutnya).", "SIAPA MENANGGUNG TIKET PULANG di akhir kontrak — tanyakan dan pastikan tertulis, jangan diasumsikan majikan pasti menanggung.", "KLAUSA BERBAHAYA — waspadai potongan gaji yang nggak jelas atau aturan yang melarangmu menghubungi keluarga."]}, {"type": "callout", "variant": "warn", "title": "Tanda bahaya besar", "text": "Kalau kamu dijanjikan jadi PRT di Riyadh, tapi di kontrak (atau di lapangan) ternyata kerja lain di kota berbeda — itu bukan cuma 'salah tulis'. Itu bisa tanda perdagangan orang. Jenis dan lokasi kerja harus sesuai janji."}, {"type": "heading", "text": "Tanda tangani SENDIRI, setelah kamu paham"}, {"type": "steps", "items": ["Minta kontraknya, baca pelan-pelan. Kamu berhak baca dulu.", "Cek enam poin di atas. Tandai yang belum jelas.", "Tanya tim Perantau Global dulu untuk hal yang nggak kamu mengerti — sebelum tanda tangan.", "Kalau sudah paham dan setuju, baru tanda tangani SENDIRI.", "Minta dan simpan salinan kontrakmu."]}, {"type": "callout", "variant": "warn", "text": "JANGAN mau diwakilkan orang lain untuk tanda tangan. JANGAN mau disuruh tanda tangan kertas kosong yang isinya diisi belakangan. Itu sumber masalah."}, {"type": "quote", "text": "Pelajaran: kontrak itu bukan formalitas — itu janji tertulis yang bicara untukmu saat ada masalah. Baca, pahami, pastikan lewat Musaned, lalu tanda tangani sendiri."}], "id": "cde43e5a-70cc-543c-9309-5d97e1754f43"}, {"lesson_num": 7, "title": "10 Jam, Tidur Cukup, Libur Seminggu Sekali: Ini Hakmu, Bukan Belas Kasihan", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Banyak PRT di Saudi disuruh kerja dari subuh sampai tengah malam, nggak pernah libur, dianggap harus standby 24 jam. Kenapa? Bukan karena memang harus begitu — tapi karena mereka nggak tahu kalau mereka punya hak yang dilindungi aturan resmi."}, {"type": "paragraph", "text": "Kamu bukan budak. Saudi punya aturan resmi untuk pekerja rumah tangga (berlaku sejak Oktober 2024) yang mengatur batas kerja, istirahat, dan libur. Ini hakmu. Kalau kamu tahu angkanya, kamu nggak gampang ditindas."}, {"type": "heading", "text": "Angka hakmu — hafal yang ini"}, {"type": "stat", "value": "10 jam", "label": "Batas maksimal kerja per hari", "sub": "Bukan kerja terus-terusan tanpa henti."}, {"type": "stat", "value": "8 jam", "label": "8 jam tidur tiap malam", "sub": "Waktu tidur yang utuh, nggak boleh dipotong-potong suruh kerja."}, {"type": "stat", "value": "1 hari", "label": "Libur penuh tiap minggu (minimal 24 jam)", "sub": "Libur dengan tetap dibayar."}, {"type": "paragraph", "text": "Selain itu: kamu nggak boleh dipaksa kerja lebih dari 5 jam berturut-turut tanpa jeda. Harus ada jeda minimal 30 menit untuk istirahat, sholat, atau makan."}, {"type": "quote", "text": "Kamu bukan budak yang standby 24 jam. Kalau dipaksa kerja terus tanpa istirahat dan tanpa libur sama sekali, itu PELANGGARAN — bukan hal normal yang harus diterima."}, {"type": "heading", "text": "Yang DITANGGUNG majikan"}, {"type": "paragraph", "text": "Ini bukan kebaikan hati majikan. Ini kewajiban mereka menurut aturan:"}, {"type": "list", "items": ["Tempat tinggal yang layak — kamu nggak bayar sendiri.", "Makan — disediakan majikan.", "Biaya berobat kalau kamu sakit — ditanggung majikan."]}, {"type": "heading", "text": "Paspormu adalah MILIKMU"}, {"type": "paragraph", "text": "Majikan DILARANG menyita paspor atau iqama-mu. Banyak penindasan dimulai dari paspor ditahan, supaya kamu nggak bisa ke mana-mana dan merasa terjebak."}, {"type": "callout", "variant": "warn", "title": "Kalau paspormu ditahan", "text": "Menahan paspor pekerja itu ILEGAL di Saudi. Kalau majikan menyita paspormu, kamu boleh menolak — dan itu sudah jadi alasan sah untuk lapor. Jangan cuma diam: hubungi KBRI Riyadh (wilayah tengah & timur) WhatsApp +966 56 917 3990, atau KJRI Jeddah (wilayah barat: Jeddah, Makkah, Madinah, Thaif) WhatsApp +966 50 360 9667, atau Direktorat Pelindungan WNI Kemlu RI +62 812-9007-0027. Kalau nyawamu terancam, telepon darurat 911 (kota besar) atau polisi 999."}, {"type": "quote", "text": "Pelajaran: hak istirahat, libur, makan, dan paspormu sendiri itu aturan — bukan minta belas kasihan. Tahu batasnya bikin kamu tidak gampang ditindas."}], "id": "dfe5de2c-e7d7-513e-8dc2-b17d1977674f"}, {"lesson_num": 8, "title": "Masa Percobaan & Kapan Kamu Boleh Pindah Majikan (Lewat Jalur Resmi)", "lesson_type": "reading", "estimated_minutes": 6, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Pertanyaan yang sering bikin takut: 'Kalau majikanku jahat, aku terjebak selamanya, nggak ya?' Jawabannya: nggak. Ada jalan keluar yang resmi. Tapi jalannya lewat lapor, bukan kabur. Pelajaran ini menjelaskan kapan dan bagaimana — dan ke siapa kamu lapor."}, {"type": "heading", "text": "Masa percobaan: maksimal 90 hari"}, {"type": "stat", "value": "90 hari", "label": "Batas maksimal masa percobaan", "sub": "Harus disepakati TERTULIS, bukan otomatis."}, {"type": "paragraph", "text": "Masa percobaan (probation) maksimal 90 hari dan harus tertulis di kontrak — kalau nggak tertulis, ya nggak ada. Selama masa percobaan ini, dua pihak (kamu dan majikan) sama-sama boleh mengakhiri kontrak."}, {"type": "heading", "text": "Kapan kamu boleh pindah majikan lewat jalur resmi"}, {"type": "paragraph", "text": "Kamu nggak bisa pindah majikan kapan saja sesuka hati. Tapi kalau majikan melanggar, ada alasan-alasan tertentu yang membolehkanmu pindah lewat jalur resmi:"}, {"type": "list", "items": ["Gaji telat berbulan-bulan (sekitar 3 bulan) tanpa alasan sah.", "Kamu mengalami kekerasan atau pelecehan dari majikan atau keluarganya.", "Kamu disuruh kerja berbahaya yang mengancam kesehatan atau keselamatanmu.", "Jasamu disewakan atau dipindah ke orang lain tanpa izinmu."]}, {"type": "callout", "variant": "info", "title": "Jujur biar kamu nggak salah harap", "text": "Sebagai PRT, kamu TIDAK bisa pindah majikan kapan saja. Pekerja rumah tangga punya aturan sendiri — beda dari pekerja pabrik/kantor. Pindah hanya boleh untuk alasan tertentu di atas, dan harus lewat proses resmi."}, {"type": "heading", "text": "Lewat proses, BUKAN kabur"}, {"type": "paragraph", "text": "Ini yang paling penting. Kalau majikan melanggar, jalannya adalah LAPOR dan minta pindah lewat proses resmi (lewat Musaned dan pelaporan ke pihak berwenang). Bukan kabur diam-diam ke jalanan."}, {"type": "callout", "variant": "warn", "title": "Kenapa jangan kabur", "text": "Kalau kamu kabur diam-diam, statusmu bisa jadi ilegal dan justru KAMU yang dianggap salah — padahal kamu korban. Lapor resmi menjaga statusmu tetap sah dan posisimu tetap kuat."}, {"type": "callout", "variant": "warn", "title": "Ke siapa kamu lapor — simpan nomor ini", "text": "Ini kontak yang bisa kamu hubungi langsung kalau majikan melanggar (gaji telat berbulan-bulan, kekerasan, paspor ditahan). KBRI Riyadh (kalau kamu di wilayah tengah & timur Saudi): WhatsApp +966 56 917 3990 atau telepon +966-11-488-2800. KJRI Jeddah (kalau kamu di wilayah barat: Jeddah, Makkah, Madinah, Thaif): hotline/WhatsApp +966 50 360 9667. Dari Indonesia atau lewat keluargamu, hubungi Direktorat Pelindungan WNI Kemlu RI +62 812-9007-0027 atau lapor di peduliwni.kemlu.go.id. Kalau nyawamu dalam bahaya saat itu juga, telepon darurat 911 (kota besar) atau polisi 999. Kamu juga bisa hubungi tim Perantau Global untuk dibantu mengarahkan. Catat nomor-nomor ini sebelum berangkat — jangan tunggu sampai butuh."}, {"type": "paragraph", "text": "Kontrak resmi Musaned jadi bukti hitam-putih yang menguatkan posisimu kalau kamu harus pindah resmi atau mengadu. Itu sebabnya kontrak resmi dari pelajaran sebelumnya begitu penting."}, {"type": "quote", "text": "Pelajaran: kalau majikan melanggar, jalurnya lapor & pindah resmi — bukan kabur ke jalanan. Simpan nomor KBRI/KJRI dan PWNI dari awal, supaya kamu tahu harus telepon ke mana."}], "id": "eaf250c2-2fdc-5628-84ea-1a261b59cdb7"}, {"lesson_num": 9, "title": "Kuis: Tahu Hakmu & Paham Kontrak", "lesson_type": "quiz", "estimated_minutes": 5, "pass_threshold": 70, "questions": [{"id": "q1", "prompt": "Sebelum tanda tangan kontrak, poin mana yang WAJIB dipastikan sudah tertulis jelas?", "multiple": false, "options": [{"key": "a", "label": "Cukup nama majikan saja, sisanya diatur belakangan di Saudi"}, {"key": "b", "label": "Nominal gaji pakai angka, plus jenis dan lokasi pekerjaan yang jelas"}, {"key": "c", "label": "Cukup tanggal berangkat, gaji dan kerjaan dibahas nanti"}]}, {"id": "q2", "prompt": "Kamu disuruh kerja terus dari subuh sampai malam, tanpa libur seminggu pun. Ini normal atau bukan?", "multiple": false, "options": [{"key": "a", "label": "Normal, namanya juga kerja di rumah orang, harus standby"}, {"key": "b", "label": "Pelanggaran — kamu berhak 1 hari libur penuh tiap minggu"}, {"key": "c", "label": "Boleh saja asal gaji dinaikkan sedikit"}]}, {"id": "q3", "prompt": "Majikan minta menahan paspormu 'biar aman'. Sikap yang paling benar?", "multiple": false, "options": [{"key": "a", "label": "Serahkan saja, kan demi keamanan"}, {"key": "b", "label": "Tolak — paspor itu milikmu dan menahannya ilegal"}, {"key": "c", "label": "Serahkan dulu, nanti minta lagi kalau mau pulang"}]}, {"id": "q4", "prompt": "Berapa batas maksimal masa percobaan (probation) untuk PRT?", "multiple": false, "options": [{"key": "a", "label": "1 tahun, otomatis berlaku"}, {"key": "b", "label": "Maksimal 90 hari, dan harus disepakati tertulis"}, {"key": "c", "label": "6 bulan, tanpa perlu ditulis di kontrak"}]}, {"id": "q5", "prompt": "Gajimu sudah telat berbulan-bulan dan kamu pernah dianiaya. Langkah paling benar?", "multiple": false, "options": [{"key": "a", "label": "Langsung kabur diam-diam dari rumah majikan"}, {"key": "b", "label": "Lapor ke KBRI/KJRI atau PWNI dan minta pindah majikan lewat jalur resmi"}, {"key": "c", "label": "Diam saja dan terima nasib sampai kontrak habis"}]}, {"id": "q6", "prompt": "Siapa yang menanggung tempat tinggal, makan, dan biaya berobatmu selama kerja?", "multiple": false, "options": [{"key": "a", "label": "Kamu sendiri, dipotong dari gaji"}, {"key": "b", "label": "Majikan — itu kewajiban mereka, bukan kebaikan"}, {"key": "c", "label": "Dibagi dua antara kamu dan majikan"}]}], "answerKeys": [{"qid": "q1", "correct": ["b"], "weight": 1, "explanation": "Sebelum tanda tangan, gaji harus tertulis pakai angka, dan jenis serta lokasi kerja harus jelas. 'Diatur belakangan' atau cuma tanggal berangkat itu tanda bahaya — bisa jadi kamu dijanjikan A tapi disuruh kerja B."}, {"qid": "q2", "correct": ["b"], "weight": 1, "explanation": "Kamu berhak 1 hari libur penuh tiap minggu (minimal 24 jam) dan istirahat cukup tiap hari. Dipaksa kerja terus tanpa libur itu pelanggaran, bukan hal normal yang harus diterima."}, {"qid": "q3", "correct": ["b"], "weight": 1, "explanation": "Paspor adalah milikmu. Majikan menahan paspor itu ILEGAL di Saudi dan sering jadi awal penindasan. Kamu berhak menolak — bahkan kalau sudah ditahan, itu sudah alasan sah untuk lapor ke KBRI/KJRI."}, {"qid": "q4", "correct": ["b"], "weight": 1, "explanation": "Masa percobaan PRT maksimal 90 hari dan harus disepakati tertulis di kontrak. Kalau tidak tertulis, berarti tidak ada masa percobaan."}, {"qid": "q5", "correct": ["b"], "weight": 1, "explanation": "Gaji telat berbulan-bulan (sekitar 3 bulan) dan kekerasan adalah alasan sah untuk pindah majikan — tapi lewat jalur resmi: lapor ke KBRI Riyadh (WA +966 56 917 3990), KJRI Jeddah (WA +966 50 360 9667), atau PWNI Kemlu (+62 812-9007-0027), bukan kabur. Kabur diam-diam bisa bikin statusmu jadi ilegal dan kamu yang dianggap salah."}, {"qid": "q6", "correct": ["b"], "weight": 1, "explanation": "Tempat tinggal, makan, dan biaya berobat adalah TANGGUNGAN majikan menurut aturan resmi. Itu hakmu, bukan kebaikan hati mereka, dan tidak boleh dipotong dari gajimu."}], "id": "fa656b84-f46e-5255-ba9f-acd184636c5e"}]}, {"module_num": 3, "id": "d3eb7bcb-14d2-59c3-956e-b7da0286b235", "title": "Hidup di Rumah Majikan: Budaya, Agama & Garis Merah yang Wajib Diketahui", "summary": "PRT/care-giver tinggal 24 jam di dalam rumah majikan Saudi, jadi norma budaya bukan sekadar sopan-santun — ini soal keselamatan, menghindari konflik, dan menghindari masalah hukum. Modul ini memberi do/don't konkret yang langsung dipakai sehari-hari: pakaian sopan & abaya saat keluar, adab tangan kanan, cara bicara tenang, ritme sholat & azan, weekend Jumat-Sabtu, aturan ketat Ramadan, dan GARIS MERAH berisiko pidana (alkohol/narkoba, memfoto orang tanpa izin, menghina agama, membocorkan rahasia rumah, batasan interaksi dengan laki-laki non-mahram). Dua reading content digabung lebih ringkas dari versi lama agar tidak bloat. Judul lesson garis merah diganti dari 'Dipenjara — Walau Nggak Sengaja' menjadi 'Lima Garis Merah yang Wajib Kamu Tahu Biar Aman' agar selaras voiceRule empati-memberdayakan (tidak menakut-nakuti audiens yang sudah cemas). Dijaga ketat: aturan Saudi banyak dilonggarkan 2017-2025 (abaya tidak lagi wajib hukum, toko tidak wajib tutup saat sholat) — jangan ajarkan 'Saudi lama' usang; framing memberdayakan.", "sort_order": 2, "lessons": [{"lesson_num": 10, "title": "Hari Pertama di Rumah Majikan: Pakaian, Tangan Kanan, Cara Bicara & Ritme Ibadah", "lesson_type": "reading", "estimated_minutes": 8, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Bayangkan dua orang sampai di rumah majikan di hari yang sama. Namanya Wati dan Nuri."}, {"type": "paragraph", "text": "Wati langsung sibuk kerja. Dia menyajikan teh pakai tangan kiri. Saat azan berkumandang, TV tetap dia setel keras. Hari Minggu dia heran kenapa masih disuruh kerja. Majikan jadi sering kesal, padahal Wati tidak punya niat jahat. Dia cuma tidak tahu adatnya."}, {"type": "paragraph", "text": "Nuri belajar dulu beberapa hal kecil. Dia pakai tangan kanan. Saat azan, dia kecilkan suara. Dia tahu hari libur di Saudi itu Jumat, bukan Minggu. Hidupnya jadi jauh lebih tenang, dan majikan menghormatinya."}, {"type": "paragraph", "text": "Bedanya bukan pintar atau bodoh. Bedanya cuma satu: Nuri tahu adatnya lebih dulu. Itulah yang akan kamu pelajari di sini. Nggak usah dihafal mati. Baca pelan-pelan saja."}, {"type": "heading", "text": "Pakaian: longgar dan menutup"}, {"type": "paragraph", "text": "Saat keluar rumah, kamu pakai pakaian longgar yang menutup badan. Biasanya majikan memberi kamu abaya untuk dipakai."}, {"type": "callout", "variant": "info", "title": "Apa itu abaya?", "text": "Abaya adalah jubah longgar (sering warna hitam) yang dipakai perempuan saat keluar rumah di Saudi. Nggak usah dihafal istilahnya. Intinya: baju panjang longgar penutup badan."}, {"type": "paragraph", "text": "Jujur saja: sejak 2018, abaya sudah tidak lagi wajib secara hukum. Tapi memakainya tetap normal dan paling aman, jadi tidak ada salahnya pakai. Di dalam rumah, biasanya kamu boleh pakai baju kerja biasa yang sopan. Simpan baju ketat atau pendek untuk di kamarmu sendiri saja."}, {"type": "heading", "text": "Adab tangan kanan"}, {"type": "paragraph", "text": "Ini hal kecil tapi penting. Makan, memberi sesuatu, dan menerima sesuatu, SELALU pakai tangan kanan. Tangan kiri dianggap tidak bersih."}, {"type": "list", "items": ["Sajikan makanan dan minuman dengan tangan kanan.", "Terima dan beri barang dengan tangan kanan.", "Kalau kamu kidal (kira tangan kiri), latih dari sekarang supaya terbiasa.", "Saat ada tamu, sajikan gahwa dan kurma dengan tangan kanan, mulai dari yang paling dihormati."]}, {"type": "callout", "variant": "info", "title": "Apa itu gahwa?", "text": "Gahwa adalah kopi khas Arab yang disajikan ke tamu, biasanya bersama kurma. Kalau kamu ditawari, jangan menolak. Sip sedikit saja sudah cukup sopan. Nggak usah dihafal namanya."}, {"type": "heading", "text": "Cara bicara: tenang dan sopan"}, {"type": "paragraph", "text": "Jaga nada bicaramu. Tenang dan sopan. Jangan membentak atau marah-marah di depan umum, walau kamu sedang kesal."}, {"type": "quote", "text": "Cara bicaramu sering lebih penting daripada isi katanya."}, {"type": "paragraph", "text": "Banyak masalah antara PRT dan majikan muncul dari salah paham budaya, bukan dari niat jahat. Kalau kamu bicara dengan tenang, banyak masalah bisa dihindari sejak awal."}, {"type": "heading", "text": "Ritme ibadah: hidup berputar mengikuti azan"}, {"type": "paragraph", "text": "Di Saudi, ada 5 waktu sholat setiap hari, ditandai azan dari masjid. Saat azan, keluarga majikan akan sholat. Hormati dengan mengecilkan TV atau musik. Kamu juga berhak waktu untuk sholat."}, {"type": "callout", "variant": "tip", "text": "Hari libur di Saudi itu JUMAT dan SABTU, bukan Sabtu-Minggu seperti di Indonesia. Hari kerja di sana Minggu sampai Kamis. Jadi jangan bingung kalau hari Minggu kamu tetap kerja. Hari libur PRT sering jatuh di hari Jumat."}, {"type": "heading", "text": "Bulan Ramadan: aturannya lebih ketat"}, {"type": "paragraph", "text": "Selama Ramadan, semua orang dilarang makan, minum, dan merokok di tempat umum pada siang hari (dari Subuh sampai buka puasa). Aturan ini berlaku untuk SEMUA orang, termasuk pekerja asing."}, {"type": "callout", "variant": "warn", "text": "Kalau kamu sedang tidak puasa (misalnya haid atau sakit), kamu tetap TIDAK BOLEH makan atau minum di tempat yang terlihat orang. Makan diam-diam saja di kamar atau dapur. Salah sedikit di tempat umum bisa jadi masalah serius."}, {"type": "paragraph", "text": "Ramadan juga jadi lebih sibuk. Kamu masak untuk sahur dan buka puasa. Siapkan tenagamu, dan istirahat saat ada kesempatan."}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Hal-hal kecil ini, tangan kanan, nada lembut, baju menutup, hormati waktu sholat dan Ramadan, yang bikin majikan menghormatimu dan hidupmu aman. Kamu tidak perlu jadi orang lain. Cukup pelajari adatnya pelan-pelan."}], "id": "93bfbcb9-e7af-5494-8eef-bd91e8451adb"}, {"lesson_num": 11, "title": "Lima Garis Merah yang Wajib Kamu Tahu Biar Aman", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Ada lima hal di Saudi yang bukan sekadar 'kurang sopan'. Kalau dilanggar, akibatnya bisa berat sekali, bahkan masalah hukum. Tapi kabar baiknya: semuanya gampang dihindari kalau kamu tahu duluan."}, {"type": "paragraph", "text": "Ini bukan untuk menakut-nakuti. Justru sebaliknya. Kalau kamu tahu lima garis merah ini, kamu jadi tenang. Kamu tidak gampang dituduh, dan tidak gampang dibohongi orang yang bilang 'ah, di sini sudah biasa begitu'."}, {"type": "heading", "text": "Garis merah 1: Alkohol & narkoba"}, {"type": "paragraph", "text": "Alkohol (minuman keras) dan narkoba ILEGAL TOTAL di Saudi. Hukumannya berat sekali."}, {"type": "callout", "variant": "warn", "text": "Jangan pernah menyentuh, menyimpan, atau membantu membawa alkohol maupun narkoba, walaupun disuruh orang lain. Kalau ada yang minta tolong 'titip bawa barang', tolak. Itu bisa menyeretmu ke masalah besar yang bukan salahmu."}, {"type": "heading", "text": "Garis merah 2: Memfoto orang tanpa izin"}, {"type": "paragraph", "text": "Memfoto atau merekam orang tanpa izin adalah pelanggaran hukum di Saudi. Apalagi kalau dikirim ke orang lain atau diposting ke media sosial."}, {"type": "paragraph", "text": "Anak majikan mungkin lucu. Kamu mungkin sayang dan ingin pamer ke teman. Tapi jangan. Jangan foto atau video anak, perempuan, atau keluarga majikan, lalu kirim atau posting."}, {"type": "quote", "text": "Aturan emasnya: jangan foto orang tanpa izin yang jelas."}, {"type": "heading", "text": "Garis merah 3: Menghina agama"}, {"type": "paragraph", "text": "Jangan pernah menghina atau bercanda merendahkan agama, Nabi, atau Al-Qur'an. Termasuk di media sosial, walaupun cuma bercanda. Ini sangat serius di Saudi."}, {"type": "heading", "text": "Garis merah 4: Membocorkan rahasia rumah"}, {"type": "paragraph", "text": "Apa yang terjadi di dalam rumah majikan, biarkan tetap di dalam rumah. Jangan cerita atau posting urusan dalam keluarga majikan, seperti pertengkaran atau rahasia mereka, ke siapa pun."}, {"type": "callout", "variant": "info", "text": "Menjaga rahasia keluarga majikan bukan cuma soal sopan-santun. Ini biasanya kewajiban HUKUM yang tertulis di kontrakmu. Jadi jangan ikut campur urusan keluarga, dan jangan jadi penyebar cerita."}, {"type": "heading", "text": "Garis merah 5: Batasan dengan laki-laki non-mahram"}, {"type": "callout", "variant": "info", "title": "Apa itu mahram dan non-mahram?", "text": "Mahram = laki-laki keluarga dekat (ayah, suami, anak, saudara kandung). Non-mahram = laki-laki selain itu, yang harus kamu jaga batasnya. Nggak usah dihafal istilahnya, yang penting paham maksudnya."}, {"type": "list", "items": ["Sebagai PRT perempuan, jangan inisiatif salaman atau menyentuh laki-laki dewasa yang bukan keluarga. Cukup angguk sopan.", "Jangan berduaan di ruang tertutup dengan laki-laki non-mahram. Cari posisi yang terbuka dan terlihat orang.", "Banyak laki-laki Saudi memang tidak akan menyalami perempuan bukan keluarganya. Itu normal, bukan karena tidak suka padamu."]}, {"type": "callout", "variant": "warn", "text": "Kalau majikan laki-laki atau siapa pun bertingkah tidak pantas kepadamu, itu BUKAN salahmu. Kamu berhak melapor. Cara melapor dan nomor yang dihubungi ada di modul berikutnya."}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Lima garis merah ini melindungimu. Tahu batasnya bukan untuk menakut-nakuti, justru biar kamu tenang, aman, dan tidak gampang dituduh. Hindari kelimanya, dan kamu sudah mengamankan dirimu dari masalah terbesar."}], "id": "ee4bcba5-2362-5d2e-9b28-fd61beafea63"}, {"lesson_num": 12, "title": "Kuis: Tahu Adat, Aman di Rumah Orang", "lesson_type": "quiz", "estimated_minutes": 4, "pass_threshold": 70, "questions": [{"id": "q1", "prompt": "Kamu menyajikan teh ke tamu majikan. Pakai tangan yang mana?", "multiple": false, "options": [{"key": "a", "label": "Tangan kiri"}, {"key": "b", "label": "Tangan kanan"}, {"key": "c", "label": "Pakai dua tangan biar cepat"}]}, {"id": "q2", "prompt": "Saat Ramadan kamu sedang haid, jadi tidak puasa, dan kamu haus di siang hari. Apa yang paling benar?", "multiple": false, "options": [{"key": "a", "label": "Minum di ruang tamu, kan ada alasan tidak puasa"}, {"key": "b", "label": "Minum diam-diam di kamar atau dapur, jangan di tempat yang terlihat"}, {"key": "c", "label": "Tahan saja sampai buka, tidak boleh minum sama sekali"}]}, {"id": "q3", "prompt": "Anak majikan lucu sekali. Kamu ingin kirim videonya ke temanmu. Apa yang paling tepat?", "multiple": false, "options": [{"key": "a", "label": "Kirim saja, kan niatnya baik karena sayang"}, {"key": "b", "label": "Jangan kirim atau posting. Memfoto orang tanpa izin bisa jadi pelanggaran hukum"}, {"key": "c", "label": "Boleh, asal wajahnya tidak terlalu jelas"}]}, {"id": "q4", "prompt": "Teman sesama PMI bertanya soal pertengkaran di keluarga majikanmu. Apa yang benar?", "multiple": false, "options": [{"key": "a", "label": "Ceritakan, biar bisa minta saran"}, {"key": "b", "label": "Jangan diceritakan. Menjaga rahasia rumah majikan biasanya kewajiban hukum di kontrakmu"}, {"key": "c", "label": "Ceritakan sedikit saja, yang penting tidak semuanya"}]}, {"id": "q5", "prompt": "Tamu laki-laki dewasa yang bukan keluarga majikan mengulurkan tangan untuk salaman. Sikap paling tepat?", "multiple": false, "options": [{"key": "a", "label": "Salami dengan erat biar dianggap ramah"}, {"key": "b", "label": "Cukup angguk sopan, tidak perlu salaman"}, {"key": "c", "label": "Pura-pura tidak lihat dan langsung pergi"}]}], "answerKeys": [{"qid": "q1", "correct": ["b"], "weight": 1, "explanation": "Selalu pakai tangan kanan untuk memberi, menerima, dan menyajikan. Tangan kiri dianggap tidak bersih, jadi memakainya untuk menyajikan teh bisa membuat tamu tersinggung."}, {"qid": "q2", "correct": ["b"], "weight": 1, "explanation": "Saat Ramadan, makan dan minum dilarang di tempat umum pada siang hari, walau kamu sedang tidak puasa. Kamu boleh minum, tapi diam-diam di kamar atau dapur, jangan di tempat yang terlihat orang."}, {"qid": "q3", "correct": ["b"], "weight": 1, "explanation": "Memfoto atau merekam orang tanpa izin adalah pelanggaran hukum di Saudi, apalagi kalau dikirim atau diposting. Walau niatnya sayang, jangan foto anak atau keluarga majikan lalu menyebarkannya."}, {"qid": "q4", "correct": ["b"], "weight": 1, "explanation": "Urusan dalam rumah majikan harus dijaga rahasianya. Ini biasanya kewajiban hukum yang tertulis di kontrakmu, jadi jangan ceritakan ke siapa pun, sedikit pun."}, {"qid": "q5", "correct": ["b"], "weight": 1, "explanation": "Sebagai PRT perempuan, jangan menyentuh laki-laki dewasa yang bukan keluarga. Cukup angguk sopan. Banyak laki-laki Saudi memang tidak menyalami perempuan bukan keluarga, jadi ini hal yang wajar."}], "id": "14e07a50-d1b8-588c-9c23-43f094262d6d"}]}, {"module_num": 4, "id": "620a062e-8447-5b78-a301-9e7a03e7f9b0", "title": "Bahasa Arab Buat Kerja & Darurat: Ngerti Perintah dan Bisa Minta Tolong", "summary": "Mayoritas majikan Saudi cuma bisa bahasa Arab. Tidak bisa bahasa = tidak paham perintah, tidak bisa minta izin/istirahat, dan paling bahaya: tidak bisa minta tolong saat sakit/bahaya. Modul ini DIPANGKAS dari 3 reading lesson (versi lama) jadi 2 untuk mengurangi beban hafalan audiens literasi rendah: frasa 'nice-to-have' dibuang, fokus ke yang benar-benar dipakai. Lesson 13 menggabung sapaan inti + perintah rumah paling sering + minta izin/'tidak paham' (lebih ramping dari versi lama yang menjejalkan ~45 frasa). Lesson 14 = KARTU FRASA DARURAT HAFAL-MATI yang berdiri sendiri sebagai artefak cetak (nilai konkret Rp500.000). Transliterasi ditulis sesuai cara baca orang Indonesia; peserta diberi tahu mereka dengar dialek Saudi/Ammiyah. Dijaga ketat: perintah selalu dipasangkan 'min fadhlak/min fadhlik' untuk versi sopan, dan nada keselamatan = 'jaring pengaman, semoga tidak perlu', bukan menakut-nakuti.", "sort_order": 3, "lessons": [{"lesson_num": 13, "title": "Frasa Inti Sehari-hari: Menyapa, Memahami Perintah & Minta Izin", "lesson_type": "reading", "estimated_minutes": 8, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Bayangkan kamu baru sampai di rumah majikan. Ibu majikan ngomong sesuatu pakai bahasa Arab. Kamu nggak ngerti satu kata pun. Dia ulangi, makin cepat, mukanya mulai kesal. Kamu cuma bisa mengangguk sambil bingung."}, {"type": "paragraph", "text": "Sekarang bayangkan hal yang sama, tapi kamu hafal segelintir kata. Begitu dia bilang satu kata kunci, kamu langsung tahu harus ngapain. Dia tenang, kamu tenang. Beda jauh, kan?"}, {"type": "paragraph", "text": "Itulah gunanya pelajaran ini. Kamu nggak perlu jago bahasa Arab. Kamu cuma butuh segelintir kata yang dipakai tiap hari. Dengan itu saja, minggu pertamamu sudah jauh lebih aman."}, {"type": "heading", "text": "Mulai dari menyapa: bikin kamu dinilai sopan hari pertama"}, {"type": "paragraph", "text": "Sopan santun di rumah majikan dimulai dari mulutmu. Salam dan ucapan terima kasih bikin majikan menilai kamu orang baik sejak hari pertama. Hafal yang ini dulu."}, {"type": "list", "items": ["Assalamu'alaikum = salam, diucapkan saat masuk atau ketemu majikan", "Syukron = terima kasih", "Afwan = maaf, atau sama-sama", "Min fadhlak (kalau bicara ke Bapak majikan) / Min fadhlik (kalau ke Ibu majikan) = tolong / permisi", "Na'am = ya", "Laa = tidak", "Mafi musykilah = tidak apa-apa / tidak masalah"]}, {"type": "callout", "variant": "tip", "title": "Kata sopan yang kecil tapi kuat", "text": "Pasangkan 'min fadhlak / min fadhlik' di belakang permintaanmu, dan kamu langsung terdengar hormat. Bedanya 'min fadhlak' dan 'min fadhlik' cuma huruf terakhir: -ak untuk laki-laki, -ik untuk perempuan. Salah dikit nggak apa-apa, yang penting kamu pakai."}, {"type": "heading", "text": "Perintah rumah yang paling sering kamu dengar"}, {"type": "paragraph", "text": "Majikan akan menyuruhmu pakai kata-kata pendek ini, berkali-kali tiap hari. Hafal ini saja dulu, kamu sudah bisa langsung tahu harus apa tanpa nunggu dia kesal mengulang."}, {"type": "list", "items": ["Nadzdzif = bersihkan", "Ighsil = cuci", "Itbukh = masak", "Ta'aal (ke Bapak) / Ta'aali (ke Ibu) = ke sini / datang", "Istanna = tunggu", "Khalas = selesai / cukup / stop", "Yalla = ayo / cepat", "Shway shway = pelan-pelan / sedikit-sedikit"]}, {"type": "callout", "variant": "info", "title": "Arti 'khalas'", "text": "'Khalas' artinya 'sudah, cukup, berhenti'. Kalau majikan bilang khalas, berarti tugasmu sudah dianggap selesai atau diminta berhenti. Ini kata penting biar kamu tahu kapan boleh berhenti. Nggak usah dihafal mati-matian — sering banget kedengeran, nanti otomatis nempel."}, {"type": "heading", "text": "Nama benda kunci, biar perintah jadi jelas"}, {"type": "paragraph", "text": "Perintah jadi gampang kalau kamu tahu nama bendanya. Cukup tiga ini dulu."}, {"type": "list", "items": ["Matbakh = dapur", "Hammam = kamar mandi / toilet", "Maa' = air"]}, {"type": "paragraph", "text": "Gabungkan saja: 'Nadzdzif al-hammam' = bersihkan kamar mandi. 'Jiib maa'' = ambilkan air. Lihat? Dua kata yang kamu sudah hafal, langsung jadi perintah yang kamu pahami."}, {"type": "heading", "text": "Kata ajaib buat minta izin: 'Mumkin...?'"}, {"type": "paragraph", "text": "Banyak PMI baru sungkan minta makan, istirahat, atau ke toilet. Padahal itu hakmu. Ada satu kata sopan yang bisa dipakai untuk minta apa saja: 'Mumkin...?' yang artinya 'Boleh...?'."}, {"type": "list", "items": ["Mumkin astariih? = Boleh saya istirahat?", "Mumkin hammam? = Boleh saya ke toilet?", "Mumkin attasil bi ahli? = Boleh saya telepon keluarga?"]}, {"type": "callout", "variant": "tip", "title": "Minta izin itu bukan merepotkan", "text": "Istirahat, ke toilet, dan kabar ke keluarga adalah hak dasarmu. Minta dengan sopan pakai 'Mumkin...?' bukan berarti kamu merepotkan — itu cara yang benar dan hormat. Berani minta dengan baik jauh lebih sehat daripada menahan-nahan sampai sakit."}, {"type": "heading", "text": "Jaring pengaman: kalau kamu nggak paham, BILANG"}, {"type": "paragraph", "text": "Kamu tidak akan langsung paham semua. Itu normal. Yang berbahaya bukan tidak paham — yang berbahaya adalah pura-pura paham lalu salah kerja. Dua kalimat ini menyelamatkanmu dari banyak masalah."}, {"type": "list", "items": ["Maa afham = saya tidak mengerti", "Marrah tsaniyah? = sekali lagi? (minta diulang)"]}, {"type": "paragraph", "text": "Biar terdengar sopan, tambahkan 'min fadhlak / min fadhlik' di belakangnya. Jujur tidak paham itu tanda kamu hati-hati, bukan tanda bodoh."}, {"type": "callout", "variant": "info", "title": "Kenapa bahasanya terdengar beda dari yang di pengajian", "text": "Yang kamu dengar di rumah majikan adalah bahasa Arab sehari-hari Saudi — namanya Ammiyah. Ini beda dari bahasa Arab Al-Qur'an yang diajarkan di pengajian. Jadi jangan kaget kalau kata-katanya terdengar lebih pendek dan beda. Contohnya huruf 'qaf' sering dibaca 'g' (jadi 'wagaf', bukan 'waqaf'). Nggak usah bingung — kamu memang lagi belajar versi rumahan."}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Pelajaran: hafal sapaan + segelintir perintah rumah ini dulu, plus 'Mumkin...?' dan 'Maa afham'. Itu sudah cukup buat lewatin minggu pertama dengan tenang."}], "id": "0687cad8-22c3-5027-a9ec-20bd6dda7887"}, {"lesson_num": 14, "title": "Kartu Frasa Darurat: Hafal Mati & Bawa Cetakannya", "lesson_type": "reading", "estimated_minutes": 6, "blocks": [{"type": "heading", "text": "Ada kata yang harus keluar sendiri, tanpa mikir"}, {"type": "paragraph", "text": "Coba pikir sebentar. Saat kamu sakit mendadak, kecelakaan, atau ada bahaya — kamu tidak punya waktu untuk membuka catatan atau menerjemahkan kata. Dalam keadaan panik, otak susah mengingat. Kata yang menyelamatkanmu harus sudah kamu hafal duluan, sampai keluar sendiri dari mulut."}, {"type": "paragraph", "text": "Tenang. Ini bukan untuk menakut-nakutimu. Anggap ini seperti pelampung di kapal: dipasang bukan karena pasti tenggelam, tapi biar aman kalau-kalau perlu. Semoga tidak pernah kamu pakai. Tapi kalau perlu, ini bisa menyelamatkan nyawamu."}, {"type": "heading", "text": "Enam kata penyelamat — hafal mati"}, {"type": "paragraph", "text": "Cuma enam. Bukan banyak. Tapi keenamnya harus benar-benar nempel sebelum kamu berangkat, bukan dipelajari setelah kejadian."}, {"type": "list", "items": ["Sa'idni! = Tolong saya!", "Ana mariidhah = Saya sakit (kalau kamu perempuan) / Ana mariidh (kalau laki-laki)", "Ureed thabiib = Saya butuh dokter", "Asy-syurthah! = Polisi!", "Laa! = Tidak!", "Khalas, wagaf! = Stop, berhenti!"]}, {"type": "callout", "variant": "info", "title": "'Laa' dan 'wagaf' itu hakmu", "text": "'Laa' (tidak) dan 'wagaf / khalas' (berhenti) wajib bisa kamu ucapkan dengan tegas. Ini untuk menolak hal yang kamu tidak mau. Mengucapkan 'tidak' dengan tegas bukan tidak sopan — itu hakmu menjaga diri. Nggak usah dihafal sambil tegang; ucapkan beberapa kali sampai terasa biasa di mulut."}, {"type": "heading", "text": "Nomor darurat Saudi: 911 dulu kalau nyawa terancam"}, {"type": "paragraph", "text": "Selain kata, hafal juga nomornya. Di kota-kota besar tempat kebanyakan PMI ditempatkan, satu nomor sudah cukup."}, {"type": "stat", "value": "911", "label": "Nomor darurat terpadu", "sub": "Berlaku di kota besar: Riyadh, Jeddah, Makkah, Madinah, dan Provinsi Timur. Satu nomor untuk polisi, ambulans, dan pemadam."}, {"type": "paragraph", "text": "Kalau kamu berada di luar kota-kota besar itu, nomornya dipisah. Hafal keduanya, jangan cuma satu."}, {"type": "list", "items": ["999 = Polisi", "997 = Ambulans (kalau sakit / kecelakaan)", "998 = Pemadam kebakaran"]}, {"type": "callout", "variant": "warn", "title": "Kalau nyawa terancam SEKARANG", "text": "Kalau kamu dipukul, dikurung, atau ada bahaya yang mengancam nyawamu saat ini juga — telepon 911 dulu, jangan menunggu. Keselamatanmu nomor satu. Urusan lapor ke KBRI/KJRI dan lain-lain bisa menyusul setelah kamu aman."}, {"type": "heading", "text": "Tulis di kartu cetak, jangan cuma di HP"}, {"type": "paragraph", "text": "Ini penting. HP bisa diambil, rusak, atau mati baterai justru saat kamu butuh. Tulis enam kata penyelamat + nomor 911 ini di KARTU CETAK kecil yang bisa kamu simpan dan sembunyikan. Bawa kartu ini bareng Kartu SOS dari modul berikutnya."}, {"type": "steps", "items": ["Tulis enam kata penyelamat + nomor darurat di kertas kecil yang kuat.", "Simpan di tempat tersembunyi yang selalu bisa kamu jangkau — bukan di HP saja.", "Hafalkan keenamnya sampai keluar sendiri, ucapkan keras-keras beberapa kali sebelum berangkat.", "Ulangi sesekali selama di Saudi supaya tidak lupa."]}, {"type": "callout", "variant": "tip", "title": "Pelajaran", "text": "Pelajaran: enam kata + nomor 911 ini, hafal sampai keluar sendiri, dan bawa cetakannya. Semoga tidak pernah kamu pakai — tapi kalau perlu, ini bisa menyelamatkan nyawamu."}], "id": "df30400f-bca7-5344-9235-e06a8612084c"}, {"lesson_num": 15, "title": "Kuis: Nyambung & Siap Darurat", "lesson_type": "quiz", "estimated_minutes": 4, "pass_threshold": 70, "questions": [{"id": "q1", "prompt": "Majikan menunjuk kamar mandi dan bilang 'nadzdzif al-hammam'. Apa yang dia minta?", "multiple": false, "options": [{"key": "a", "label": "Bersihkan kamar mandi"}, {"key": "b", "label": "Ambilkan air ke kamar mandi"}, {"key": "c", "label": "Tutup pintu kamar mandi"}]}, {"id": "q2", "prompt": "Kamu ingin telepon keluarga di kampung. Kalimat paling sopan untuk minta izin adalah:", "multiple": false, "options": [{"key": "a", "label": "Langsung ambil HP dan telepon tanpa bilang apa-apa"}, {"key": "b", "label": "Mumkin attasil bi ahli? (Boleh saya telepon keluarga?)"}, {"key": "c", "label": "Yalla, yalla! (Ayo, cepat!)"}]}, {"id": "q3", "prompt": "Majikan bicara cepat pakai bahasa Arab dan kamu sama sekali tidak paham. Apa yang paling benar kamu lakukan?", "multiple": false, "options": [{"key": "a", "label": "Mengangguk dan pura-pura paham biar tidak dimarahi"}, {"key": "b", "label": "Diam saja dan tebak-tebak sendiri apa yang harus dikerjakan"}, {"key": "c", "label": "Bilang 'Maa afham' (saya tidak mengerti) atau 'Marrah tsaniyah?' (sekali lagi?)"}]}, {"id": "q4", "prompt": "Kamu (seorang perempuan) merasa sakit dan butuh dokter. Kata yang tepat untuk diucapkan adalah:", "multiple": false, "options": [{"key": "a", "label": "Ana mariidhah, ureed thabiib (Saya sakit, saya butuh dokter)"}, {"key": "b", "label": "Ana ja'aanah (Saya lapar)"}, {"key": "c", "label": "Mafi musykilah (Tidak apa-apa)"}]}, {"id": "q5", "prompt": "Ada bahaya yang mengancam nyawamu sekarang juga dan kamu sedang berada di Riyadh. Nomor apa yang kamu telepon?", "multiple": false, "options": [{"key": "a", "label": "Nomor calo yang dulu memberangkatkan kamu"}, {"key": "b", "label": "911"}, {"key": "c", "label": "Tidak usah telepon siapa-siapa, tunggu sampai pagi"}]}, {"id": "q6", "prompt": "Tentang enam kata darurat (Sa'idni, Ana mariidhah, Ureed thabiib, Asy-syurthah, Laa, Khalas-wagaf), kapan kamu harus menghafalnya?", "multiple": false, "options": [{"key": "a", "label": "Sebelum berangkat, sampai keluar sendiri tanpa mikir, dan ditulis di kartu cetak"}, {"key": "b", "label": "Nanti saja kalau sudah benar-benar ada masalah di Saudi"}, {"key": "c", "label": "Cukup disimpan di HP, tidak perlu dihafal"}]}], "answerKeys": [{"qid": "q1", "correct": ["a"], "weight": 1, "explanation": "'Nadzdzif' artinya bersihkan dan 'hammam' artinya kamar mandi. Jadi 'nadzdzif al-hammam' = bersihkan kamar mandi. Hafal dua kata ini saja, perintahnya langsung jelas."}, {"qid": "q2", "correct": ["b"], "weight": 1, "explanation": "'Mumkin...?' artinya 'Boleh...?' — kata sopan untuk minta izin apa saja. Menelepon keluarga itu hakmu, dan meminta izin dengan sopan adalah cara yang benar dan hormat."}, {"qid": "q3", "correct": ["c"], "weight": 1, "explanation": "Pura-pura paham lalu salah kerja jauh lebih berbahaya daripada jujur bilang tidak mengerti. 'Maa afham' atau 'Marrah tsaniyah?' menyelamatkanmu dari kesalahan dan menunjukkan kamu hati-hati."}, {"qid": "q4", "correct": ["a"], "weight": 1, "explanation": "'Ana mariidhah' = saya sakit (untuk perempuan), dan 'Ureed thabiib' = saya butuh dokter. Ini dua dari enam kata penyelamat yang wajib kamu hafal mati sebelum berangkat."}, {"qid": "q5", "correct": ["b"], "weight": 1, "explanation": "911 adalah nomor darurat terpadu di kota besar seperti Riyadh, Jeddah, Makkah, dan Madinah. Kalau nyawa terancam sekarang, telepon 911 dulu — jangan menunggu, dan jangan mengandalkan calo."}, {"qid": "q6", "correct": ["a"], "weight": 1, "explanation": "Saat darurat kamu tidak punya waktu untuk membuka catatan, dan HP bisa diambil. Karena itu kata darurat harus dihafal sampai keluar sendiri SEBELUM berangkat, dan ditulis di kartu cetak yang disembunyikan."}], "id": "5d994eb6-3698-580b-847d-6101bc7a2791"}]}, {"module_num": 5, "id": "98a34be3-cf92-5083-a84d-52827717572e", "title": "Sehat Sebelum & Sesudah Berangkat + Lapor Kalau Kena Masalah", "summary": "Modul ini dirombak dari Modul 5 lama yang oleh kritikus dinilai menjejalkan terlalu banyak misi (heat stroke + kulit kering + gegar budaya + homesick dalam 1 lesson 7 menit). Sekarang dipisah rapi menjadi tiga benang yang berbeda — dan ditambah GAP BARU dari kritikus. (1) PERSIAPAN KESEHATAN PRA-BERANGKAT (gap baru): vaksin yang diperlukan/dianjurkan untuk Saudi, bawa obat rutin + surat dokter, beresin gigi/mata SEBELUM berangkat karena akses berobat di Saudi tergantung majikan. (2) KESELAMATAN-FISIK & LAPOR: panas gurun + heat stroke + pertolongan pertama, plus langkah saat gaji ditahan/paspor disita/kekerasan, anti-huroob, kontak SOS resmi (artefak Kartu SOS cetak), DAN rencana cadangan komunikasi (gap baru: hafal 1 nomor keluarga, titip kontak ke PMI lain, antisipasi HP disita). (3) KESEHATAN-MENTAL terpisah: gegar budaya & homesick itu normal & mereda. Topik low-stakes kulit/lip balm dari versi lama dibuang. Kontak diframe 'simpan & verifikasi terbaru sebelum berangkat'; 'jangan kabur' = 'lapor dulu, bukan tahan apa pun'; TIDAK menyentuh angle finansial.", "sort_order": 4, "lessons": [{"lesson_num": 16, "title": "Siapkan Badanmu Dulu: Vaksin, Obat Rutin & Beresin Gigi Sebelum Berangkat", "lesson_type": "reading", "estimated_minutes": 6, "blocks": [{"type": "heading", "text": "Coba pikir dulu sebentar"}, {"type": "paragraph", "text": "Bayangin kamu lagi di rumah majikan, jauh dari keluarga. Tiba-tiba gigimu sakit berdenyut sampai nggak bisa tidur. Mau ke dokter, tapi harus minta izin majikan dulu, dan belum tentu langsung dibawa. Sakitnya kamu tahan berhari-hari."}, {"type": "paragraph", "text": "Sekarang bandingkan dengan kalau gigi itu kamu obati di kampung, sebelum berangkat. Selesai, beres, nggak jadi beban di rantau. Jauh lebih enak, kan?"}, {"type": "paragraph", "text": "Itulah inti pelajaran ini. Badan yang sehat sebelum berangkat itu modal kerjamu. Apa pun yang bisa dibereskan sekarang, beresin dulu — selagi gampang dan murah."}, {"type": "heading", "text": "Kenapa harus disiapkan dari sekarang"}, {"type": "paragraph", "text": "Di Saudi, majikan memang wajib menanggung biaya berobatmu. Tapi kamu tetap harus minta dulu, dan kadang tidak langsung dibawa. Buat masalah kecil yang sebenarnya bisa kamu cegah dari sekarang, itu sayang sekali."}, {"type": "paragraph", "text": "Jadi prinsipnya gampang: apa pun yang bisa diurus selagi di Indonesia, urus sekarang. Beres dari kampung, hati tenang di rantau."}, {"type": "heading", "text": "Tiga hal yang wajib kamu urus sebelum berangkat"}, {"type": "steps", "items": ["Vaksin. Saudi punya syarat vaksin tertentu untuk pendatang. Jangan mengira-ngira sendiri — tanya vaksin apa yang kamu perlukan ke klinik medical resmi (Wafid) atau tim PG. Lalu simpan baik-baik buku atau kartu vaksinmu.", "Obat rutin. Kalau kamu punya penyakit yang harus minum obat tiap hari — misalnya darah tinggi atau asma — bawa stok obat secukupnya. Minta juga SURAT DOKTER (sebaiknya ada terjemahannya) supaya tidak masalah di imigrasi dan majikan tahu kebutuhanmu.", "Gigi dan mata. Periksakan dan obati gigi-matamu SEKARANG selagi gampang. Kalau kamu pakai kacamata, bawa cadangan."]}, {"type": "callout", "variant": "tip", "title": "Saran praktis", "text": "Buat daftar kecil di kertas: gigi sudah dicek, obat rutin sudah dibawa, surat dokter sudah ada, vaksin sudah lengkap. Coret satu per satu. Kalau semua sudah tercoret, badanmu siap."}, {"type": "heading", "text": "Ini beda dengan medical Wafid"}, {"type": "paragraph", "text": "Ingat medical yang kamu jalani di jalur resmi (dibahas di Modul 1)? Itu namanya medical Wafid — dulu disebut GAMCA. Tesnya menyaring penyakit menular seperti TBC dan hepatitis."}, {"type": "callout", "variant": "info", "title": "Glosarium: Wafid", "text": "Wafid (portal resminya wafid.com) adalah standar pemeriksaan kesehatan untuk pekerja yang mau ke negara Teluk termasuk Saudi. Dulu namanya GAMCA. Nggak usah dihafal — yang penting medical ini bagian dari jalur resmi, dan kamu mengurusnya lewat tim PG, bukan lewat website-website calo."}, {"type": "paragraph", "text": "Medical Wafid memastikan kamu tidak membawa penyakit menular. Persiapan vaksin, obat, dan gigi-mata di pelajaran ini melengkapinya — supaya badanmu benar-benar siap kerja, bukan cuma lolos saringan."}, {"type": "callout", "variant": "tip", "text": "Pelajaran: badan yang sehat sebelum berangkat itu modal kerja. Urus vaksin, bawa obat rutin + surat dokter, dan beresin gigi-mata sekarang — selagi gampang."}], "id": "e3036a02-c9aa-5c51-9dfd-5b1e2036bc74"}, {"lesson_num": 17, "title": "Kartu SOS: Simpan & Cetak Nomor Penting + Rencana Cadangan Kalau HP Disita", "lesson_type": "reading", "estimated_minutes": 7, "blocks": [{"type": "heading", "text": "Coba bayangkan sebentar"}, {"type": "paragraph", "text": "Wati nyimpan semua nomor penting di HP-nya. Nomor keluarga, nomor agen, semuanya di HP. Suatu hari HP-nya diambil majikan. Sekarang Wati tidak punya satu nomor pun yang bisa dia hubungi. Dia merasa benar-benar sendirian."}, {"type": "paragraph", "text": "Nuri beda. Selain di HP, dia menulis nomor-nomor penting di selembar kartu kecil yang dia sembunyikan. Dia juga hafal satu nomor keluarganya di luar kepala. Waktu HP-nya bermasalah, Nuri tetap punya jalan minta tolong."}, {"type": "paragraph", "text": "Pelajaran ini bikin kamu jadi seperti Nuri. Kita buat Kartu SOS — satu kartu cetak berisi nomor penting yang kamu bawa dan simpan, bukan cuma di HP."}, {"type": "callout", "variant": "warn", "title": "Kenapa nggak cukup di HP", "text": "HP bisa disita. Kalau semua nomormu cuma di HP dan HP-nya diambil, kamu kehilangan semua jalan minta tolong. Kartu cetak yang disembunyikan adalah cadanganmu."}, {"type": "heading", "text": "Isi Kartu SOS: nomor yang harus kamu tulis"}, {"type": "paragraph", "text": "Tulis nomor-nomor di bawah ini di kartu kecil. Sembunyikan kartunya di tempat aman. Bawa bareng Kartu Frasa Darurat dari Modul 4. Mulai dari jalur Indonesia — ini yang kamu utamakan dulu."}, {"type": "list", "items": ["KBRI Riyadh (untuk wilayah tengah & timur Saudi). Telepon: +966-11-488-2800. WhatsApp hotline: +966 56 917 3990. Email: riyadh.kbri@kemlu.go.id.", "KJRI Jeddah (untuk wilayah barat: Jeddah, Makkah, Madinah, Thaif). Hotline/WhatsApp: +966 50 360 9667. Email: jeddah.kjri@kemlu.go.id.", "Direktorat Pelindungan WNI Kemlu RI: +62 812-9007-0027.", "Lapor diri online di peduliwni.kemlu.go.id."]}, {"type": "callout", "variant": "info", "title": "Pilih sesuai kotamu", "text": "Kalau kamu kerja di Jeddah, Makkah, Madinah, atau Thaif (wilayah barat), hubungi KJRI Jeddah. Kalau di Riyadh atau wilayah tengah-timur, hubungi KBRI Riyadh. KBRI dan KJRI menolong WNI GRATIS — jangan malu lapor."}, {"type": "heading", "text": "Jalur Saudi"}, {"type": "list", "items": ["19911 = hotline pengaduan resmi Kementerian Tenaga Kerja Saudi (HRSD). Melayani pekerja domestik, termasuk korban kekerasan (layanan Bahasa Indonesia belum tentu ada).", "911 = nomor darurat terpadu untuk bahaya fisik mendesak di kota besar (Riyadh, Jeddah, Makkah, Madinah)."]}, {"type": "callout", "variant": "warn", "title": "Catatan jujur soal 19911", "text": "Layanan Bahasa Indonesia di 19911 belum tentu ada. Jadi untuk urusan WNI, tetap utamakan jalur RI dulu — KBRI Riyadh atau KJRI Jeddah."}, {"type": "heading", "text": "Nomor bisa berubah — ini cara amannya"}, {"type": "steps", "items": ["Sebelum berangkat, salin nomor-nomor ini ke Kartu SOS-mu.", "Cek ulang nomor terbaru ke tim PG atau situs resmi (kemlu.go.id, kp2mi.go.id) — nomor hotline bisa berubah sewaktu-waktu.", "Begitu sam
